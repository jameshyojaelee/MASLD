# =============================================================================
# config/pipeline_params.yaml
# Global analysis parameters and SLURM defaults for the MASLD pipeline.
# Centralizes all thresholds so changes propagate to all scripts.
# =============================================================================

# ---------------------------------------------------------------------------
# Base paths (relative to project root, or override with env var)
# Override via: export MASLD_PROJECT_ROOT=/your/path
# ---------------------------------------------------------------------------
paths:
  project_root: "/gpfs/commons/groups/sanjana_lab/Cas13/MASLD_library_design"
  human_base: "RNA-seq/Human/Patient_Cohorts"
  mouse_base: "RNA-seq/Mouse"
  results: "results"

# Reference genomes
reference:
  human:
    genome: "GRCh38.p14"
    annotation: "GENCODE v49"
    star_index: "/gpfs/commons/home/jameslee/reference_genome/gencode_v49/star_index"
    gtf: "/gpfs/commons/home/jameslee/reference_genome/gencode_v49/gencode.v49.chr_patch_hapl_scaff.annotation.gtf.gz"
  mouse:
    genome: "GRCm39"
    annotation: "GENCODE vM38"
    star_index: "/gpfs/commons/home/jameslee/reference_genome/gencode_vm38/star_index"
    gtf: "/gpfs/commons/home/jameslee/reference_genome/gencode_vm38/gencode.vM38.chr_patch_hapl_scaff.annotation.gtf.gz"

# ---------------------------------------------------------------------------
# QC thresholds
# ---------------------------------------------------------------------------
qc:
  min_library_size: 5000000          # Minimum mapped reads to pass QC
  min_gene_count: 1000               # Minimum number of detected genes (CPM > 0)
  max_pct_mito: 50                   # Maximum % mitochondrial reads (placeholder)
  sex_check_enabled: true            # Run XIST/DDX3Y sex inference

# ---------------------------------------------------------------------------
# Differential expression thresholds
# ---------------------------------------------------------------------------
de:
  padj_de: 0.1                       # Adjusted p-value cutoff for per-study DE summary
  padj_sig: 0.05                     # Adjusted p-value cutoff for mega/meta significance

# ---------------------------------------------------------------------------
# Consensus DEG thresholds
# CANONICAL (2026-08-12): the DEG definition is the conventional adjusted-p + effect-size gate.
#   canonical DEG = padj < 0.05 AND |log2FC| > 0.50  (~1,853 DEGs on the read-count substrate)
# Chosen for comparability with the published RNA-seq literature. The 0.50 floor is deliberate:
# floors of 0.25-0.30 push the genetic-overlap test into nominally significant DEPLETION
# (Fisher p = 0.042 / 0.030), a harder claim than the orthogonality the paper argues.
# CAVEAT (must appear in Methods): the effect-size filter is applied AFTER FDR adjustment
# rather than folded into the test, so the adjusted p-value does not carry a calibrated error
# rate for the filtered set (McCarthy & Smyth 2009). Report the TREAT arm as the comparator.
# SUPERSEDES the TREAT interval-null gate (canonical 2026-06-29 .. 2026-08-12; ~1,918 DEGs).
# treat_* columns are RETAINED in canonical_deg_results.csv as the sensitivity arm and back the
# sealed F_five / lncRNA candidate drift assertions — do NOT remove them.
# Source-of-truth: 05h (columns) + 07 (bulk_sig) + 27a (l1_active) +
# load_figure_data.R::is_canonical_deg() must match.
# ---------------------------------------------------------------------------
consensus:
  # CANONICAL (2026-08-12): conventional adjusted-p + effect-size floor.
  canonical_conventional:
    padj: 0.05
    lfc: 0.5                           # 2026-08-12: canonical DEG = padj<0.05 & |log2FC|>0.5 (~1,853). See header for why 0.5 and not a minimal floor.
  # TREAT (RETIRED AS CANONICAL 2026-08-12; retained as the calibrated sensitivity arm)
  canonical_treat:
    treat_fdr: 0.05
    treat_lfc: 0.25                    # Was canonical 2026-06-29..2026-08-12 (~1,918 DEGs). Columns retained; still backs sealed candidate drift assertions. Env override: CANONICAL_TREAT_LFC in 05h.
  # ashr (LEGACY/REFERENCE sensitivity): shrunk effect + lfsr sign-error gate
  canonical_ashr:
    lfsr: 0.05
    shrunk_lfc: 0.3                    # LEGACY reference (was canonical 2026-06-27..06-29; ~3,626 DEGs). NOT canonical.
  # Dream (LEGACY alias of the now-canonical raw thresholds; kept for back-compat readers)
  dream:
    padj: 0.05
    lfc: 0.5                           # Same numbers as canonical_conventional above; retained so legacy consumers keying on `dream` do not silently diverge.

  # Human Tier 1: significant in BOTH dream AND meta-analysis (legacy reference)
  tier1:
    padj: 0.05
    lfc: 1.0
    require_both: true               # Must pass in dream AND meta

  # Human Tier 2: significant in EITHER dream OR meta-analysis (legacy reference)
  tier2:
    padj: 0.05
    lfc: 0.5
    require_both: false              # Passes in dream OR meta

  # Mouse consensus thresholds
  # mouse_lfc: Set to 0.5 (cross-species match with human canonical) on 2026-04-27
  # following 5-fold leave-one-diet-out LOO-CV stability analysis
  # (M_loo_lfc_stability.R). The mouse stability metric did NOT yield a clean
  # elbow: across-fold CV(N DEGs) and mean Jaccard are dominated by diet-model
  # heterogeneity (CDAHFD/FPC fold-out drops recovery to 69-75% regardless of
  # LFC; HFD/MCD fold-out keeps it >85%). Mean Jaccard 0.65-0.74 across
  # LFC in [0.25, 1.0]; mean recovery 76-80% across the full sweep. Given the
  # absence of a stability-driven optimum, we match the human canonical
  # (|logFC|>0.5) for cross-species comparability. See
  # figures/supplementary/figS06_cross_species/mouse_loo_lfc_stability.pdf and
  # RNA-seq/Mouse/Unified_Integration/results/loo_lfc_stability_data.csv
  mouse_lfc: 0.3                     # 2026-06-27: matched to new human canonical (shrunk+lfsr 0.3); was 0.5. (mouse stability metric has no clean elbow — see comment above — so we track the human canonical for cross-species comparability.)
  mouse_min_diets: 3                 # Require presence in >= 3 of 5 diet models

# ---------------------------------------------------------------------------
# Library design thresholds
# ---------------------------------------------------------------------------
library:
  padj: 0.1
  lfc: 0.8
  tpm_protein_coding: 1.0
  tpm_lncrna: 0.5
  direction: "up"                    # Only upregulated targets for Cas13 knockdown

# ---------------------------------------------------------------------------
# SLURM job defaults
# ---------------------------------------------------------------------------
slurm:
  micromamba_path: "/gpfs/commons/home/jameslee/.local/bin/micromamba"
  conda_env: "rnaseq"

  human_integration:
    partition: "bigmem"
    cpus: 32
    mem: "400G"
    time: "48:00:00"

  mouse_integration:
    partition: "bigmem"
    cpus: 16
    mem: "128G"
    time: "48:00:00"

  per_dataset_snakemake:
    partition: "cpu"
    cpus: 8
    mem: "64G"
    time: "48:00:00"

  download:
    partition: "io"
    cpus: 8
    mem: "32G"
    time: "12:00:00"
    chunk_size: 5                    # Samples per array job task

# ---------------------------------------------------------------------------
# Pathway analysis
# ---------------------------------------------------------------------------
pathway:
  gsea_min_size: 15
  gsea_max_size: 500
  gsea_nperm: 10000
  fdr_cutoff: 0.05
  gene_sets:
    - "H"         # Hallmark
    - "C2:KEGG"   # KEGG pathways
    - "C2:REACTOME"
    - "C5:GO:BP"  # GO Biological Process
    - "C5:GO:MF"  # GO Molecular Function
