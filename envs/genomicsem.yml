  - r-remotes
  - r-lavaan
  - r-data.table
  - r-ashr
  - r-mass
  - r-matrix
  - r-mgcv
  - r-rcpp
  - r-r.utils
  - r-readr
  - r-stringr
  - r-plyr
  - r-dplyr
  - r-gdata
  - r-e1071
  - r-foreach
  - r-doparallel
  - r-splitstackshape
  - r-mgsub
  - r-ggplot2
