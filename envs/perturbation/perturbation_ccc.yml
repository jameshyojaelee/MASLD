name: perturbation_ccc
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - r
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - cuda-toolkit=12.4
  - cudnn
  - nccl
  - libstdcxx-ng>=13.3
  # PyTorch (for STATE-receiver propagation)
  - pytorch=2.5.*
  - torchvision
  - pytorch-cuda=12.4
  # R for NICHES
  - r-base>=4.4
  - r-essentials
  - r-seurat>=5
  - r-tidyverse
  - r-devtools
  - r-biocmanager
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  # Single-cell Python
  - scanpy>=1.10
  - anndata>=0.10
  - mudata
  # Data
  - numpy<2
  - pandas
  - scipy
  - scikit-learn
  - polars
  - pyarrow
  - h5py
  - tqdm
  # CCC / spatial
  - squidpy>=1.5
  - omnipath
  # Optimal transport (COMMOT)
  - pot>=0.9
  # JAX for pertpy
  - "jax<0.4.30"
  - "jaxlib<0.4.30"
  # Bio utils
  - biopython
  - mygene
  # Vis
  - matplotlib
  - seaborn
  - pip:
    # LIANA+ for ligand-receptor inference
    - liana>=1.4
    # COMMOT for OT-based CCC
    - commot>=0.0.3
    - pertpy
# Notes:
# - cellchat-py removed (no PyPI). NICHES is R-only — installed via R remotes in build_ccc.sbatch.
# - libstdcxx-ng + LD_LIBRARY_PATH=$CONDA_PREFIX/lib fix CXXABI 1.3.15 / GLIBCXX issues
