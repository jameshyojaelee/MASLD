    source: GEO
    publication: "Guilliams et al., Cell 2022"
    technology: 10x_Visium
    # Mixed species dataset: 10 mouse + 5 human
    spaceranger_output_dir: Analysis/Spatial/results/spaceranger/GSE192741/
    data_source: geo_processed  # Processed SpaceRanger outputs from GEO
    # Per-sample metadata from GSE192741_sampleInfo_spatialRNAseq.tsv
    sample_metadata:
      # Mouse healthy (StSt = standard chow)
      JBO001: {species: mouse, condition: Healthy, strain: C57Bl6, individual: Mouse_001}
      JBO002: {species: mouse, condition: Healthy, strain: C57Bl6, individual: Mouse_001}
      JBO003: {species: mouse, condition: Healthy, strain: C57Bl6, individual: Mouse_001}
