  ##############################################################################
  # Govaere 2026 Nat Genetics — MASLD multi-omics macrophage paper
  # DOI: 10.1038/s41588-026-02600-3
  # Two NEW spatial modalities (in addition to existing bulk GSE135251).
  # See data/external/govaere2026_natgenetics/README.md for full provenance.
  ##############################################################################

  govaere2026_geomx:
    source: Zenodo
    publication: "Govaere et al., Nat Genetics 2026"
    doi: "10.5281/zenodo.18153344"
    technology: NanoString_GeoMx_WTA
    species: human
    raw_data_dir: data/external/govaere2026_natgenetics/geomx/
    dcc_dir: data/external/govaere2026_natgenetics/geomx/raw_DCC_Files/
    annotation_file: data/external/govaere2026_natgenetics/geomx/Annotation file ROIs.xlsx
    h5ad_output: Analysis/Spatial/results/preprocessed/geomx_govaere2026.h5ad
    expression_tsv: Analysis/Spatial/results/govaere2026/geomx_expression.tsv
    metadata_tsv: Analysis/Spatial/results/govaere2026/geomx_metadata.tsv
    n_segments: 80          # raw; expect ~77 after 10% above-LOQ QC
    n_patients: 8           # MASH F3, MAS >=4
    n_slides: 4
    region_types: [steatohepatitis, low_steatosis, portal_tract]
    segment_markers: [CD68, CD45, panCK]
    cohort: "MASH F3 'at-risk' biopsies (UREC 18/0182)"
    norm_method: Q3         # NanoString GeoMx native normalization
    loader_env: geomx       # micromamba activate geomx (bioconductor-geomxtools)
    loader_script: Analysis/Spatial/scripts/40_govaere2026_geomx_load.R
    converter_script: Analysis/Spatial/scripts/40b_geomx_to_anndata.py
    notes:
      - "Raw DCC files (126); expression matrix reconstructed via GeomxTools 3.10"
      - "Paper QC: 10% probes above LOQ → 77 segments / 9,572 genes retained"
      - "All segments are MASH F3 — no stage variability within dataset"
      - "Atlas contribution: spatial_govaere2026_geomx_{sh_vs_pt,sh_vs_ls,gpnmb_vs_kc}_logfc"

  govaere2026_cosmx:
    source: GEO
    publication: "Govaere et al., Nat Genetics 2026"
    accession: GSE312698
    technology: NanoString_CosMx_1000plex
    species: human
    raw_data_dir: data/external/govaere2026_natgenetics/cosmx/
    h5ad_output: Analysis/Spatial/results/preprocessed/cosmx_govaere2026.h5ad
    cell_metadata_tsv: Analysis/Spatial/results/govaere2026/cosmx_cell_metadata.tsv
    n_cells_total: 552676           # all 4 Leuven samples merged
    n_cells_pass_qc: 522145         # after min_counts=20, min_genes=10, min_cells_per_gene=5
    n_genes_target: 968             # 1000-plex panel after stripping 11 Neg + 197 SystemControl + 14 custom
    n_samples: 4                    # Leuven subset; paper references 10 total MASLD samples
    panel: "Human Universal Cell Characterization RNA Panel + 14 custom"
    sample_metadata:
      Leuven_1: {gsm: GSM9351704, n_cells: 405940, disease: TBD_from_GEO}
      Leuven_2: {gsm: GSM9351705, n_cells:  70886, disease: TBD_from_GEO}
      Leuven_3: {gsm: GSM9351706, n_cells:  35537, disease: TBD_from_GEO}
      Leuven_4: {gsm: GSM9351707, n_cells:  40313, disease: TBD_from_GEO}
    samples: [Leuven_1, Leuven_2, Leuven_3, Leuven_4]
    cell_types_expected: [KC, MetMac, TransMac, preMac, Monocyte, cDC1, cDC2, migDC, Hepatocyte, Cholangiocyte, Mesenchymal, Endothelial, Lymphocyte]
    loader_env: spatial             # micromamba activate spatial
    loader_script: Analysis/Spatial/scripts/41_govaere2026_cosmx_load.py
    notes:
      - "Per-sample inputs: exprMat_file.csv.gz + metadata_file.csv.gz + fov_positions_file.csv.gz + polygons.csv.gz + Seurat .rds"
      - "Disease stage per sample needs GEO sample_characteristics_ch1 query"
      - "Atlas contribution: spatial_govaere2026_cosmx_{metmac_score, gpnmb_score, mash_vs_nomash_logfc}"

