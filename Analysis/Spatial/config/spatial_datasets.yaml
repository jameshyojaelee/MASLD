  # ─── Vu et al. JHEP Reports 2025 (UQeSpace, FFPE CytAssist) ──────────────
  Vu_et_al_2025:
    source: UQeSpace  # doi.org/10.48610/e95155f
    publication: "Vu et al., JHEP Reports 2025"
    technology: 10x_Visium_CytAssist_FFPE
    species: human
    condition: MASLD_spectrum  # F0-F4 fibrosis, mixed per array
    n_arrays: 10
    n_biopsies: 33  # Multiple biopsies per array (no per-patient splitting)
    data_source: uqespace_processed  # Pre-processed SpaceRanger outputs
    spaceranger_output_dir: Analysis/Spatial/results/spaceranger/Vu_et_al_2025/
    raw_data_dir: data/vu_et_al_2025/raw/Visium/
    # Each "sample" is one Visium array containing multiple FFPE biopsies
    # Without barcode-to-patient mapping CSVs, we treat arrays as units
    sample_metadata:
      VLP115_A: {species: human, condition: MASLD_spectrum, individual: VLP115_A}
      VLP115_D: {species: human, condition: MASLD_spectrum, individual: VLP115_D}
      VLP116_A: {species: human, condition: MASLD_spectrum, individual: VLP116_A}
      VLP116_D: {species: human, condition: MASLD_spectrum, individual: VLP116_D}
      VLP119_A: {species: human, condition: MASLD_spectrum, individual: VLP119_A}
      VLP119_D: {species: human, condition: MASLD_spectrum, individual: VLP119_D}
      VLP120_A: {species: human, condition: MASLD_spectrum, individual: VLP120_A}
      VLP120_D: {species: human, condition: MASLD_spectrum, individual: VLP120_D}
      VLP121_A: {species: human, condition: MASLD_spectrum, individual: VLP121_A}
      VLP121_D: {species: human, condition: MASLD_spectrum, individual: VLP121_D}
    samples:
      - VLP115_A
      - VLP115_D
      - VLP116_A
      - VLP116_D
      - VLP119_A
      - VLP119_D
      - VLP120_A
      - VLP120_D
      - VLP121_A
      - VLP121_D
    notes:
      - "FFPE CytAssist — different QC profile than fresh-frozen Visium"
      - "33 biopsies across 10 arrays; no per-patient barcode mapping available"
      - "Fibrosis stages F0-F4 (14 F0/F1, 5 F2/F3a, 14 F3b/F4)"
      - "Includes per-spot pathologist annotations in original study (not in download)"
      - "CODEX spatial proteomics also available (not used)"
      - "Used for validation: SVG replication, spatial concordance with GSE192741"

