# Study meta-data
gwas_id: GCST90132314
author_notes: "1. GWAS summary statistics for the primary discovery meta-analysis
  from Aragam KG, Jiang T, Goel A et al (2022) Discovery and systematic characterization
  of risk variants and genes for coronary artery disease in over a million participants.
  Nature Genetics.\n\n2. Columns included in the file are:\n\np_value - the p-value
  from the fixed-effect inverse variance weighted meta-analysis across studies for
  each variant.\nchromosome - the autosome each variant is found on.\nbase_pair_location
  - the position of each variant according to GRCh37.\neffect_allele - the allele
  to which the beta and odds ratio correspond.\nother_allele - the 'non-effect' allele
  (i.e. the allele that is not the effect allele).\neffect_allele_frequency - the
  average allele frequency for the effect allele across the studies in the meta-analysis
  for each variant (as estimated by METAL).\nodds_ratio - the estimated per-allele
  odds ratio for the effect allele from the meta-analysis.\nbeta - the beta estimate
  for the effect allele from the meta-analysis.\nstandard_error - the standard error
  for the beta estimate for the effect allele from the meta-analysis.\nmarkername
  - a unique variant identifier comprising chromosome, base_pair_position, first allele,
  second allele. Positions are based on GRCh37.\nfreqse - the standard error of the
  frequency of the effect allele across the studies (as estimated by METAL).\nminfreq
  - the minimum frequency of the effect allele across the studies (as estimated by
  METAL).\nmaxfreq - the maximum frequency of the effect allele across the studies
  (as estimated by METAL).\ndirection - the direction column from the METAL output,
  which includes the studies in the following order according to the three different
  meta-analyses (see column descriptor for 'meta_analysis' below): \n\n'Cardiogram'
  (n=11): UK Biobank, CARDIoGRAMplusC4D-1000G, EPIC-CVD, GerMIFs5, GerMIFs6, GerMIFs7,
  deCODE, Greek Coronary Disease cohort, HUNT, Mass General Brigham Biobank, TIMI\n\
  'Exome' (n=11): UK Biobank, CARDIoGRAMplusC4D-Exome, GerMIFs1, GerMIFS2, GerMIFs5,
  GerMIFs6, GerMIFs7, Greek Coronary Disease cohort, deCODE, Mass General Brigham
  Biobank, TIMI\n'Metabo' (n=10): UK Biobank, CARDIoGRAMplusC4D-Metabo, GerMIFs4,
  GerMIFs5, GerMIFs6, GerMIFs7, Greek Coronary Disease cohort, HUNT, Mass General
  Brigham Biobank, TIMI\n\nhetisq - the estimated I2 value representing the between-study
  heterogeneity in the meta-analysis for each variant (as estimated by METAL).\nhetchisq
  - the estimated chi-squared ('Q') value representing the between-study heterogeneity
  in the meta-analysis for each variant (as estimated by METAL).\nhetdf - the number
  of degrees of freedom (i.e. non-missing studies minus one) in the meta-analysis
  for each variant.\nhetpval - the p-value for the between-study heterogeneity in
  the meta-analysis for each variant (as estimated by METAL).\ncases - the total number
  of coronary artery disease (CAD) cases included in the meta-analysis for each variant.\n
  effective_cases - the sum of the effective number of cases (calculated within each
  study as the variant-specific INFO score multipled by the number of cases, with
  INFO score=1 for genotyped variants) across studies.\nn - the total sample size
  (CAD cases and controls) included in the meta-analysis for each variant.\nmeta_analysis
  - denotes whether the summary statistics for each variant are from the CARDIoGRAMplusC4D
  1000Genomes imputed GWAS ('Cardiogram'), Cardiometabochip ('Metabo') or Exomechip
  ('Exome') meta-analysis (based on the maximum number of effective cases for variants
  that were available in more than one meta-analysis).\n\n3. This file comprises the
  GWAS summary statistics for the primary discovery meta-analysis. There are technically
  3 separate meta-analyses of de novo datasets with previously published CARDIoGRAMplusC4D
  summary statistics using (a) 1000Genomes imputed genome-wide genotypes, (b) CardioMetabochip,
  and (c) Exomechip. For each variant, only the results with the largest number of
  effective cases were kept. The summary statistics are after implementation of a
  post-meta-analysis QC filter, which required a variant with p_value<1e-5 from the
  meta-analysis to have at least 2 studies with point estimates in the same direction
  of effect as the overall meta-analysis direction of effect, and the 2nd largest
  p_value to be less than 0.2 (i.e. 2 studies have p<0.2). This filter removed some
  clearly erroneous variants driven by single studies."
