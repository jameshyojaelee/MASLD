team: perturbation-campaign-d2
arm: D2_Reversal
goal: Rank all 33,943 atlas genes by Diseased→Healthy hepatocyte signature reversal

models:
  - scGen (zs + ft latent arithmetic)
  - CPA (zs + ft compositional)
  - STATE (zs + ft)
  - Tahoe-100M (~1,100 chemical perturbations — native fit)
consensus_rule: 2-of-4 (gene ranks top-5% in ≥2 models with consistent direction)

hit_set:
  file: data/hits/d2_reversal_hits.csv
  size: ~33,943 (all atlas genes)

reference_signatures:
  - ref_a: Progressor+Moderate pseudobulk vs Healthy+Stable (hepatocyte subtype-based)
  - ref_b: Bulk Diseased-vs-Control from 5-cohort canonical (847 samples)
  - ref_c: F0-control vs F4-cirrhotic from staged subset
  sensitivity: all 3 refs used; final reversal score is consensus-weighted

subagents:
  - name: arm_lead_d2
    role: Arm Lead
    agent_type: general-purpose
    reports_to: cross_arm_coordinator
  - name: data_engineer_d2
    role: Data Engineer
    agent_type: general-purpose
    reports_to: arm_lead_d2
  - name: ref_signature_specialist_d2
    role: Reference Signature Specialist (ARM-SPECIFIC)
    agent_type: general-purpose
    owns: 3 alternative healthy refs + sensitivity analysis; owns reference_signatures/ outputs
    reports_to: arm_lead_d2
    independence: standalone
  - name: runner_scgen_d2
    role: Model Runner — scGen
    agent_type: general-purpose
    reports_to: arm_lead_d2
    independence: BLINDED
  - name: runner_cpa_d2
    role: Model Runner — CPA
    agent_type: general-purpose
    reports_to: arm_lead_d2
    independence: BLINDED
  - name: runner_state_d2
    role: Model Runner — STATE
    agent_type: general-purpose
    reports_to: arm_lead_d2
    independence: BLINDED
  - name: runner_tahoe_d2
    role: Model Runner — Tahoe-100M
    agent_type: general-purpose
    reports_to: arm_lead_d2
    independence: BLINDED
  - name: peer_reviewer_d2
    role: Peer Reviewer (Methods)
    agent_type: general-purpose
    reports_to: arm_lead_d2
    independence: independent of runners
  - name: stratification_auditor_d2
    role: Stratification Auditor
    agent_type: general-purpose
    reports_to: arm_lead_d2
    independence: independent of runners
  - name: consensus_aggregator_d2
    role: Consensus Aggregator
    agent_type: general-purpose
    reports_to: arm_lead_d2
  - name: backtester_d2
    role: Backtester
    agent_type: general-purpose
    owns: cross-validate vs LINCS Strategy 11 + known reversers (resmetirom→THRB, GLP1RA→GLP1R, aramchol→SCD, FXR-NR1H4)
    reports_to: arm_lead_d2
    independence: blinded to consensus
  - name: lit_reviewer_d2
    role: Literature Reviewer
    agent_type: general-purpose
    reports_to: arm_lead_d2
    independence: independent of runners
  - name: output_writer_d2
    role: Output Writer
    agent_type: general-purpose
    owns: reversal ranking table, top-100 JSON cards, figure panels
    reports_to: arm_lead_d2
  - name: atlas_integrator_d2
    role: Atlas Integrator
    agent_type: general-purpose
    reports_to: cross_arm_coordinator

deliverables:
  - results/d2_reversal/reversal_ranking.csv (all 33,943 genes ranked)
  - results/d2_reversal/cards/<gene>.json (top 100)
  - results/d2_reversal/reference_sensitivity.csv
  - results/d2_reversal/lincs_concordance.csv (cross-validation vs Strategy 11)
  - 3 atlas columns: perturb_reversal_score, perturb_reversal_rank, perturb_reversal_stage_specific
