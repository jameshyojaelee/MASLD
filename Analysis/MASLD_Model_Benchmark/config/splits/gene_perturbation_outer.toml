admission_gates = ["Freeze perturbation direction, target gene, guide family, control identity, and biological-unit ancestry before normalization or feature selection.", "Use unseen-target folds only for GEARS, GenePert, and the scGPT perturbation head; no outcome from the held gene may enter controls, coexpression, differential-expression genes, embeddings, or tuning.", "Use held-biological-replicate or held-context folds with already observed perturbations for scGen and CellOT.", "Use CPA and perturblib only where every evaluation atom is in the training vocabulary; reject unknown categories rather than mapping them to control.", "Pseudobulk and resample independent cultures, animals, or donors. Cells, guides, GEM groups, lanes, wells, organoids, and libraries are not independent biological replicates.", "Keep CRISPRa, CRISPRi, and knockout response directions separate unless the model explicitly encodes direction and the cross-direction task is prospectively registered."]
