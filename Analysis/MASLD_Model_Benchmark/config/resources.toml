[profiles.gpu_b6k_training]
partition = "gpu"
cpus = 16
memory_gb = 170
# Training wall time, not the four-hour smoke budget.  With the three scientific
# wave actions (prepare, fit, predict) the planner allows
# (324000 - 900) // 3 = 107700 seconds, or 29.92 hours, per action.
# Memory is 170 GB rather than the 200 GB of gpu_single so that two
# single-GPU jobs fit one 350 GB B6K node, which carries two GPUs.
wall_time = "90:00:00"
gpus = 1
accelerator = "b6k"
qos = "nslab"
admission_blocking = false
blockers = []

[profiles.gpu_rna_atac_b6k]
partition = "gpu"
cpus = 4
memory_gb = 64
# Identical to gpu_rna_atac_smoke so metadata.adapter_timeout_seconds stays 4500.
# The accelerator is the only field that differs.
wall_time = "04:00:00"
