blockers = ["GenePert requires one exact gene embedding per perturbed gene, while GSE281160 holds out noncoding loci and guide families. Nearest-gene, linked-gene, and random-vector substitution change the task and are prohibited. The official repository has no detected license, and the exact GenePT embedding artifact, source snapshot, gene mapping, and redistribution terms are unresolved. Retain only for a separately registered gene-perturbation task; then fit replicate-preserving ridge models and all preprocessing inside held-target folds."]
supported_tasks = ["gene_perturbation_response"]

