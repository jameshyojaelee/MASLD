license_status = "BSD-3-Clause"
exposure_status = "target_label_unexposed"
status = "deferred"
admission_blocking = true
blockers = ["CellOT learns one transport map from observed control and perturbed distributions for a specified perturbation; perturbation identity is not an input and it cannot infer a wholly unseen target without that target's outcomes. Keep it for a future known-perturbation held-donor/context distributional task. If activated, split biological replicates before any PCA/autoencoder or fit; prohibit held-target perturbed cells from transport, reduction, and checkpoint selection; replace cell-level train/test and test-MMD selection with inner grouped validation; preserve distribution-level unpaired semantics; and freeze the legacy runtime and safe state artifacts."]
