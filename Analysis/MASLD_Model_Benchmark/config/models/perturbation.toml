display_name = "GEARS"
implementation_type = "train_locally"
checkpoint_revision = "snap-stanford/GEARS@f374e43e197b295016d80395d7a54ddb81cc6769"
checkpoint_sha256 = "NOT_APPLICABLE"
license_status = "MIT"
exposure_status = "target_label_unexposed"
status = "deferred"
admission_blocking = true
blockers = ["GEARS is not schedulable on the current held noncoding-target task: it requires each perturbation to be a gene symbol present in both the expression vocabulary and GO graph, while GSE281160 perturbs noncoding variant loci with CRISPRi guides. Nearest-gene substitution would change the task and inject a new prior. Retain GEARS only for a separately registered gene-perturbation task. Then freeze fold-local genes, controls, coexpression and safe GO graphs before preprocessing; prohibit upstream pickle splits/downloads and cross-role control sampling; use replicate-level scoring; and freeze runtime, seeds, and artifact hashes."]
supported_tasks = ["gene_perturbation_response"]

