license_status = "repository_GPL-3.0_package_metadata_MIT_conflict"
exposure_status = "target_label_unexposed"
status = "deferred"
admission_blocking = true
blockers = ["scGen estimates a latent shift from observed control and perturbed cells; it cannot identify the effect vector for a wholly unseen perturbation target. Keep it registered for a future known-perturbation held-context/donor task. If activated, resolve the GPL-3.0 repository versus MIT package-metadata conflict; split target, guide family, and biological replicate before normalization/HVGs/training/delta estimation; prohibit held-target stimulated cells and test-delta leakage; replace random balancing with recorded fold-local row-ID sampling; and freeze runtime and artifacts."]
supported_tasks = ["gene_perturbation_response"]

