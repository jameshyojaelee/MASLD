claim_gate = "Only complete task-specific GSE289173 eQTL/ieQTL summaries inside the one jointly sealed outcome bundle permit a champion. On signed cell-type effects, compare only capability-registered primary outputs and require mean Fisher-z Spearman gain >=0.03 over the strongest primary-eligible sequence/context baseline, paired lower bound above zero, and no major lineage worse by >0.03. Separately require eQTL-retrieval AUPRC noninferiority against nearest-gene, ABC, rE2G, and other retrieval-eligible baselines. Link-only, accessibility-only, MPRA-only, observed-target-context, representation-only, and negative-control records cannot win the signed-effect endpoint; otherwise no champion."
