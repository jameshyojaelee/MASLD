admission_gates = ["Complete the corrected 50-study COLOC rerun and promote a frozen graph snapshot.", "Train assay-profile models only on donor-held GSE296875/GSE244832 RNA-ATAC inputs; never expose held-donor ATAC to an RNA-conditioned inference request.", "For identical downstream heads on general sequence encoders, treat GSE281364 as a locus-cross-fitted training source: every reported MPRA prediction must be out-of-fold by merged locus, sequence identity, and reverse-complement identity. Never fit a head on all MPRA outcomes and score those same rows.", "GSE281364 supports an assay-native MPRA activity or allelic-direction head, not a supervised cell-type eQTL/ieQTL effect head. No nonsealed signed eQTL/ieQTL development source is currently registered; until one is added before selection lock, eQTL-specific head fitting and calibration are disabled, while zero-shot/native scores and frozen cross-assay MPRA transfer remain eligible.", "The frozen variant capability registry is binding: only primary-eligible gene-level signed outputs enter Fisher-z cell-type effect scoring; accessibility, MPRA, representation, and enhancer-gene-link outputs remain on their assay-native secondary endpoints.", "Nearest-gene, ABC, and rE2G are retrieval/link baselines and cannot be treated as signed-effect baselines; context-only, trans-only, and mean-track null allele deltas remain ablations, not evidence of effect direction.", "deltaSVM and direct gkm-SVM consume the same fold/state/seed LS-GKM weights. Report their distinct score definitions, but group them as one fitted-model family for selection, uncertainty, multiplicity, complementarity, and evidence counting.", "Keep GSE281160 CROP-seq as a development-only direction diagnostic; guides and cells are not biological replicates and its 20 MPRA-selected targets are not an unbiased test set.", "Group variants by LD block, locus, sequence identity, and reverse-complement identity.", "Compute native-build LD before liftover and retain native coordinates.", "Resolve model licenses, hashes, exposure, allele orientation, and reference compatibility."]
