blockers = ["Full activation is blocked by an anomalous automatic Scrublet call in donor S35: threshold 0.038886 classified 8,762 of 11,080 deposited barcodes as doublets and left 1,571 nuclei. The source-exact and prospectively capped QC memberships must be compared, with a leave-S35-out sensitivity, before any biological evaluation or model selection.", "The exact Cell Ranger reference remains unresolved because the GEO processing text is internally inconsistent. Use the deposited H5 feature genome and identifiers as the source authority; retain only the 35,455 stable-ID-exact GENCODE v49 genes and mask the other 1,146 features.", "No deposited barcode-level author cell annotation exists. The public author code documents manual analysis using unreleased intermediate objects and cannot be treated as exact supervised labels; transferred or reconstructed labels cannot become accuracy truth.", "Keep the nine alcohol-associated cirrhosis/hepatitis donors as an etiology OOD challenge. They are not MASLD-negative controls and cannot select a MASLD classifier.", "No biological transfer TaskSpec is executable for this cohort yet. Any registered DatasetView is compatibility-smoke-only and cannot authorize model selection, biological performance, or an external claim."]
notes = "Frozen source output file f54ac799b22cb02912b82432929255e6400d871cc0fd99dbf9b4756f8f977a20 contains 197,942 deposited CellBender-filtered, pre-project-QC barcodes from 26 independent human liver donors: 6 healthy controls, 3 MASLD F0, 4 MASH fibrosis, 4 MASH cirrhosis, 4 alcohol-associated cirrhosis, and 5 alcohol-associated hepatitis. Project-reconstructed strict public-code QC retained 165,372 before unreleased author manual cluster removal; this is not an author-final analyzed-nucleus census. QC sensitivity output file 77b7b62b30c49fdf306039a3c31930040a5a140d23a64dd24875370cc11e91ad retains 172,997 under an outcome-blind 10-percent cap for the single pathological automatic call and requires leave-S35-out analysis. The 17 healthy/MASLD/MASH donors are external development only; the nine alcohol-associated donors are an etiology OOD stratum. Age is observed for all 26 donors (20-80 years) and recorded sex for all 26 (11 female, 15 male), but these donor fields are metadata rather than another aliquot. Crosswalk output file 54ca7af31f6ae223defdee4a7c1d7931f7cba4362f621fe9646fd08530c4c6da maps 35,455 of 36,601 features by version-stripped stable ID and masks 1,146; only 23,173 also preserve the gene name. Full model training remains inactive."

