notes = "Nineteen participants comprise four normal controls, five healthy-obese, five bland-steatosis, and five early-NASH participants. Metadata audit ARTIFACTS bac433336705b74dcb2a6ef6b6594af10fef362769d564adfea9788fe546e88e reproduced the full 114-record cross-product. Authoritative join/rights ARTIFACTS 574eeee1119054a2d7b55066804accf29fb45f23b591dd26f9d61d907b27a75f triangulates official GEO, every sample title and characteristic, and the source article (PMCID PMC6175862; DOI 10.1038/s41467-018-06611-5). Label-free assay-native activation ARTIFACTS fc529784b5f6df53af7ba82036ff617507ca9d551d64d79aac6cb9061faf62bb binds 19 opaque participant groups, all 57 RNA and 57 RRBS libraries, the prior exhaustive 800,713,381-row RRBS audit, and a coverage-aware adjacent-section TaskSpec. It establishes that RNA and RRBS use adjacent cryosections, never the same section, cell, nucleus, or molecule. Public internal nonclinical research use needs no new DUA; redistribution is prohibited and derivative weights require model-specific review. Participant is the inferential unit; zone, section, assay, library, CpG, strand, and read are repeated or technical observations. STATE AS OF 2026-08-30: the CpG remap and the RNA quantification are complete, verified by recomputing from the output files. Do not re-acquire or re-quantify; the 57 raw FASTQ (79,576,393,854 bytes) and the 57 x 86,369 RSEM matrices already exist. Fitting and scoring have still not run, and model training remains blocked on the evaluator implementation alone, not on data acquisition. The sentence this replaces was written on 2026-08-24 and was true then; the work ran on 2026-08-25. COMPLETED 2026-08-25, verified 2026-08-30 by recomputing from the output files rather than reading receipts: all 57 raw RNA FASTQ are present under executions/gse105127-production-9675cd48993468d4/rna_raw/participants totalling 79,576,393,854 bytes, which matches the run manifest exactly; RNA is quantified with RSEM 1.3.3 over STAR 2.7.10b against GRCh38.p14 and GENCODE v49, single-end, unstranded, seed 105127, into 57 by 86,369 matrices of expected counts, TPM, effective lengths and lengths with no rounding and no normalization; the failure-aware round-trip CpG crosswalk is at executions/gse105127-gzip-preflight-v2-4f96d314e84de086/cpg_crosswalk/cpg_crosswalk.tsv.gz with 19,689,155 source intervals, 19,602,356 accepted as mapped_unique_cpg and a 0.4408 percent failure rate, every source CpG retained with an explicit state; all 57 RRBS per-participant-zone collapses are present; participant folds are settled without outcomes in that execution's activation/participant_folds.tsv. DO NOT RE-ACQUIRE OR RE-QUANTIFY. INTERPRETIVE LIMIT, recorded before any fit exists and not open to revision after a result is seen: GSE105127 is the only source of liver zone labels in this project and there is no second cohort to escalate to, so a model that fails here cannot be distinguished from one that would have succeeded on a better-powered cohort. A negative outcome in this dataset is therefore indeterminate and never tested_negative. The survey supporting all of the above is in executions/gse105127-zone-prediction-design-20260830."

