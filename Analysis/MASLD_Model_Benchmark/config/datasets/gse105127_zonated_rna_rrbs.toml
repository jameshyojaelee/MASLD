notes = "Nineteen participants comprise four normal controls, five healthy-obese, five bland-steatosis, and five early-NASH participants. Metadata audit ARTIFACTS bac433336705b74dcb2a6ef6b6594af10fef362769d564adfea9788fe546e88e reproduced the full 114-record cross-product. Authoritative join/rights ARTIFACTS 574eeee1119054a2d7b55066804accf29fb45f23b591dd26f9d61d907b27a75f triangulates the official GEO overall design, every sample title and characteristic, and the source article (PMCID PMC6175862; DOI 10.1038/s41467-018-06611-5). It freezes five phenotype-balanced participant folds and corrects the topology to adjacent-section RNA and RRBS. These are not same-section, same-cell, or same-molecule measurements. Public internal nonclinical research use needs no new DUA; redistribution is prohibited and derivative weights require model-specific review. Participant is the inferential unit; zone, section, assay, and library are repeated measurements. Model training remains blocked."

