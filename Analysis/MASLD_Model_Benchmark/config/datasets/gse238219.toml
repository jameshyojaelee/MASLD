blockers = ["The guide-to-target/control crosswalk and exact raw Cell Ranger feature axis were frozen in job array 21067095, but the Cell Ranger reference annotation authority remains unresolved.", "GEO deposits five objects labelled replicates, while the paper states that differential expression used two Perturb-seq replicates. Resolve culture, transduction, capture, and sequencing ancestry before declaring the number of independent biological cultures.", "Split target gene, guide family, and culture replicate before normalization, feature selection, model fitting, or delta/transport estimation; source-derived perturbation-effect tables are prohibited inputs.", "The 11 genes were selected using human genetic evidence and are conditional follow-up, not an unbiased discovery or independent genetic validation set.", "Freeze a rights authority before model-input use or aggregate redistribution."]
