blockers = ["Resolve whether deposited H3K27ac region labels are 0-based half-open BED coordinates or 1-based inclusive count-annotation coordinates. Both interpretations pass GRCh38.p14 primary-contig bounds, so sequence extraction remains prohibited.", "Freeze a task-specific activation contract separating coordinate-dependent sequence tasks from coordinate-independent RNA-H3K27ac tasks.", "Do not release derivative weights materially trained on this source until model-specific source terms and legal review pass.", "Do not activate a MASLD sequence-histone head or external claim until its applicable remaining blockers pass."]
notes = "The source paper reports 30 NAFL, 50 NASH, and 28 histologically normal participants among 108 bariatric-surgery liver biopsies, with H3K27ac profiled in 99 liver samples. Metadata audit ARTIFACTS bac433336705b74dcb2a6ef6b6594af10fef362769d564adfea9788fe546e88e and matrix audit ARTIFACTS 4e0d17f392530f4e6f0b54346d5d9333e450b7606d9698fbf7253a4f2a0e0417 recovered 99 exact RNA-H3K27ac IDs, 43,285 RNA features, and 96,460 integer H3K27ac regions. Authoritative-join ARTIFACTS e6c539c5fb29cd357dc126073779948c73c27fd219ff7a4d80b3d20a6cddb580 triangulated official GEO, the source article, deposited titles, source-native histology, and both matrix axes. It freezes the 99-participant paired subset as same-sample different-aliquot with stage-balanced outer folds. RNA-measurement ARTIFACTS 38531e463837cafd2c8e321411048c7b8b493876c3c964c0f50790cac8806f2f audited all 11,340,670 values and the exact pre-deposit public PISCES tag. The matrix is nonnegative fractional expression estimates: continuous outer-training-fold-fitted inputs are permitted, while integer count likelihoods, rounding, and DESeq2 reconstruction without tximport offsets are prohibited. Reference-crosswalk ARTIFACTS da491302ea738a92017978518239bc3884a7635d580e01e3bd28cd4f55b630c2 maps 42,163 genes exactly to GENCODE v49, masks 1,122 retired genes, and places all H3K27ac regions within GRCh38.p14 primary contigs. QC/rights ARTIFACTS ac7c92fd01b2b4240b380e4f6a58d98f1a6f853f8d0ad98d7167d7af34baaa73 confirms all 99 pairs pass the hard assay-library rule and public internal research use needs no new DUA; redistribution is prohibited and derivative weights require review. H3K27ac coordinate base remains ambiguous and sequence extraction is prohibited. Assay-record counts are not inferential n and model training remains blocked pending task-specific activation."

