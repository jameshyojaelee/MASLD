blockers = ["RESOLVED 2026-09-06 by structural inference, not by a primary-source statement: the deposited H3K27ac region labels are 1-based inclusive. Two prespecified falsifiable tests agree (frozen tree executions/gse267145-coordinate-convention-21473307, ARTIFACTS sha256 23931bcfd5d4116efbcc95bd8b0af337006a99aadb6950f77c5cab3d34a9f754): (a) in the official Supplementary Table 3 ChromHMM annotation columns, inclusive widths are multiples of 200 in 14,140 of 14,320 rows against 58 under a half-open reading, and start_position minus 1 reproduces an independent 0-based Roadmap E066 breakpoint 7,596 times while start_position and start_position plus 1 do so 0 times; (b) over 96,436 same-contig adjacent deposited pairs the minimum of next_start minus prev_end is 2 with no pair at 0 or 1, the GenomicRanges::reduce postcondition under 1-based arithmetic and not the bedtools merge postcondition. See docs/decisions/2026-09-06-gse267145-coordinate-convention.md. Gene-anchored aggregation, interval overlap, genomic distance and coordinate-derived annotation are unblocked (tier 1). Base-resolution sequence use is permitted only under declared counted_interval semantics with the recorded 1-bp residual (tier 2); base-resolution correspondence to the called peak stays blocked. coordinate_semantics_resolved remains false because no primary source states the convention, and every guard requiring it to be false is unchanged.", "Global dataset and coordinate-dependent admission remain blocked. Only the coordinate-independent paired-bulk TaskSpec frozen by activation ARTIFACTS e5042eb43dddd84cda81c5aeed5d6dbeb0378ab1c942a0183e2ef1b41cd18b20 is active.", "LIFTED 2026-09-07 BY OWNER OVERRIDE, see docs/decisions/2026-09-07-derivative-weight-release.md. This blocker previously read: 'Do not release derivative weights materially trained on this source until model-specific source terms and legal review pass.' The repository owner states that restriction was written by an agent, not by them, and was never imposed; this is an open GEO deposit with no licence detected and no DUA (executions/gse267145-qc-rights-21065336/rights_contract.json: explicit_data_license_detected false, new_dua_or_controlled_access_required false). Derivative model weights trained on this source, including a distilled student, ARE releasable and may enter a release/ tree. Raw and processed DATA from this source are still not rehosted (config/resources.toml human_raw_data_policy), so a release ships weights, code, manifests, hashes, fetchers, splits and aggregate metrics only.", "Do not activate a MASLD sequence-histone head or external claim until its applicable remaining blockers pass. AMENDMENT 2026-09-02, authorized by the repository owner: ONE narrowly scoped external-claim use is permitted, namely scoring the deposited bulk RNA matrix with ALREADY-FROZEN release weights to report fibrosis and NAS severity performance as an external validation arm. This carve-out is conditional on ALL of the following, and any use failing any one of them remains blocked: (a) bulk RNA only, no H3K27ac matrix, no region, no coordinate, no sequence; (b) no weight is fitted, refitted or tuned on this source, and no source outcome is used to select a model, threshold or feature; (c) SUPERSEDED 2026-09-07 by the owner override above: derived WEIGHTS may enter a release/ tree; source DATA still may not be redistributed; (d) the matrix is treated as nonnegative fractional expression estimates under the allowed transforms log1p_library_scaled and rank_or_quantile_mapper, never as integer counts; (e) the reported denominator is the 99 of 262 RNA columns carrying histology. All other external-claim, sequence, interval, motif, source-outcome-selection and unrestricted derivative-weight uses remain blocked, and the coordinate convention blocker is untouched and still prohibits sequence extraction. SUPERSEDED IN PART 2026-09-15 BY OWNER DECISION, see docs/decisions/2026-09-15-gse267145-sequence-use.md: this closing clause of the 2026-09-02 amendment predates blockers[0], which resolved the coordinate convention on 2026-09-06 and permits base-resolution sequence use under declared counted_interval semantics with the recorded 1-bp residual. Base-resolution sequence extraction is permitted. Base-resolution correspondence to the called peak, coordinate_semantics_resolved = false, global admission, and every other clause of this amendment are unchanged."]
notes = "The source paper reports 30 NAFL, 50 NASH, and 28 histologically normal participants among 108 bariatric-surgery liver biopsies, with H3K27ac profiled in 99 liver samples. Metadata audit ARTIFACTS bac433336705b74dcb2a6ef6b6594af10fef362769d564adfea9788fe546e88e and matrix audit ARTIFACTS 4e0d17f392530f4e6f0b54346d5d9333e450b7606d9698fbf7253a4f2a0e0417 recovered 99 exact RNA-H3K27ac IDs, 43,285 RNA features, and 96,460 integer H3K27ac regions. Authoritative-join ARTIFACTS e6c539c5fb29cd357dc126073779948c73c27fd219ff7a4d80b3d20a6cddb580 triangulated official GEO, the source article, deposited titles, source-native histology, and both matrix axes. It freezes the 99-participant paired subset as same-sample different-aliquot with stage-balanced outer folds. RNA-measurement ARTIFACTS 38531e463837cafd2c8e321411048c7b8b493876c3c964c0f50790cac8806f2f audited all 11,340,670 values and the exact pre-deposit public PISCES tag. The matrix is nonnegative fractional expression estimates: continuous outer-training-fold-fitted inputs are permitted, while integer count likelihoods, rounding, and DESeq2 reconstruction without tximport offsets are prohibited. Reference-crosswalk ARTIFACTS da491302ea738a92017978518239bc3884a7635d580e01e3bd28cd4f55b630c2 maps 42,163 genes exactly to GENCODE v49, masks 1,122 retired genes, and places all H3K27ac regions within GRCh38.p14 primary contigs. QC/rights ARTIFACTS ac7c92fd01b2b4240b380e4f6a58d98f1a6f853f8d0ad98d7167d7af34baaa73 confirms all 99 pairs pass the hard assay-library rule and public internal research use needs no new DUA; redistribution is prohibited and derivative weights require review. Coordinate/task activation ARTIFACTS e5042eb43dddd84cda81c5aeed5d6dbeb0378ab1c942a0183e2ef1b41cd18b20 proves that 14,348 official Supplementary Table 3 liver regions exactly reuse deposited feature keys but finds no direct coordinate-convention statement; the convention was subsequently frozen as 1-based inclusive by structural inference on 2026-09-06, see blockers[0]. It activates only participant-held coordinate-independent bulk RNA-to-H3K27ac profile and observed-pair multiview development lanes under TaskSpec SHA-256 8bf05fe693c787ffdd8fe11443e019e668ecd03318c708e390785edd837b1a28. Sequence, interval, motif, source-outcome-selection, external-claim, and unrestricted derivative-weight uses remain blocked."

