blockers = ["Freeze and hash the authoritative well-namespaced barcode-to-donor assignment before any split, fit, or evaluation.", "Treat well as a technical batch and freeze a leave-one-well-out sensitivity analysis in addition to donor-grouped inference.", "The publication resolves Cell Ranger ARC v2 against GRCh38-2020-A with filtered GENCODE v32 for gene quantification and EnsDb.Hsapiens.v86 for TSS QC; freeze the deposited feature/peak identities and auditable v32-to-v49 and peak-coordinate crosswalks. An unmapped feature is missing, not a biological zero.", "Freeze endpoint-specific missingness masks and denominators: steatosis is observed for 38 of 39 analyzed donors and fibrosis for 37 of 39; do not encode missing pathology as absence.", "Freeze an adult-only histopathology sensitivity before fitting: the analyzed cohort spans ages 13 to 75 and includes five donors under 18; never silently exclude them or generalize an all-age estimate to adults.", "Freeze the donor-level covariate model and limit use to cross-sectional histology-associated modeling. Data S1 has BMI and donor-linked fibrosis and steatosis fields but no explicit MASLD or MASH adjudication, NAS, ballooning, lobular inflammation, or visible alcohol and etiology exclusions; do not make a MASLD diagnosis or MASLD-specific stage claim."]
notes = "Thirty-nine analyzed donors and 68,398 same-nucleus RNA-ATAC profiles are pooled across eight deposited wells. Data S1 Table S1 includes fibrosis_categorical, fibrosis_status, steatosis_categorical, steatosis_numeric, steatosis_status, and BMI; steatosis is observed for 38 donors and fibrosis for 37. Donors remain inferential units and wells remain technical batches. These support cross-sectional histology-associated development analyses after join, missingness, and covariate checks pass, not MASLD/MASH diagnosis or longitudinal progression. Primary supplement Data S1: https://ars.els-cdn.com/content/image/1-s2.0-S0002929725004343-mmc2.xlsx ; DOI: https://doi.org/10.1016/j.ajhg.2025.11.009 ."

