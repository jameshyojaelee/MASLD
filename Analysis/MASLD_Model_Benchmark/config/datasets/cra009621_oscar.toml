blockers = ["Resolve mouse-of-origin and independent organoid-culture ancestry. The three EM and six DM production experiments are Chromium capture lanes downstream of one described 500,000-cluster infection workflow and are not biological replicates.", "Freeze the authoritative mm10 Cell Ranger 3.1.0 feature reference and raw-count/preprocessing semantics. The acquired author matrices are integer, finite, and nonnegative but do not by themselves establish raw-count semantics.", "Resolve the source target-count discrepancy: the article uses 79 candidates in its overview, reports 78 factors in Methods, and the pinned author metadata contains 77 observed target-gene labels.", "Keep guide identities nested within target gene and culture; do not estimate uncertainty from cells, organoids, BioSamples, experiments, capture lanes, or guides when independent cultures are unresolved.", "The targets were selected from liver-development knowledge and bulk contrasts, so the screen is conditional follow-up and cross-species stress evidence.", "Complete checkpoint-specific exposure audits before using this public 2023 dataset with pretrained perturbation models."]
notes = "Pinned author commit 57dce224345b3ba25baf585c8a025d4b156d5342 provides 41,383 uniquely assigned cells across 30,217 differentiation-medium and 11,166 expansion-medium cells, 17,444 features, 77 observed target genes, 226 observed target guides across contexts, and 10 non-targeting guides. At most one shared screen pool is included for descriptive development use; independent mouse or culture ancestry remains unresolved. This mouse intrahepatic-cholangiocyte organoid transition is not a mature human-hepatocyte donor endpoint."

