blockers = ["Resolve the 77 GEO samples versus 70 participants reported in the associated publication and freeze a one-row-per-participant deduplication map before any split or metric.", "Resolve whether participant-level histology and fibrosis fields can be joined without ambiguity; until then this cohort has no stage endpoint.", "The GEO samples are labeled early MASLD and provide neither healthy controls nor a broad stage range; use only for early-MASLD domain transport and never as a diagnostic, case-control, or progression cohort.", "Freeze an auditable GENCODE v29-to-v49 gene crosswalk; an unmapped gene is missing and must not be encoded as zero.", "Freeze rights, labels, QC, reference, exposure, and artifact-manifest authorities before activation."]
notes = "GEO deposits 77 processed human liver bulk RNA samples labeled early MASLD and a merged HTSeq count matrix aligned to GRCh38 with GENCODE v29. The associated report describes 70 participants, so samples are not assumed to be independent people. This source can test representation transport into an early-MASLD bulk domain after deduplication, but it cannot establish stage discrimination or supply controls."

