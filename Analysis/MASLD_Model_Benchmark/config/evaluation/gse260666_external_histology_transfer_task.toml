admission_gates = [
  "Freeze the GSE267145 RNA-only recipe from participant-held internal development before any full-99 refit. GSE260666 features or labels cannot choose the recipe, hyperparameters, feature count, calibration, threshold, or model family.",
  "Refit the locked preprocessing and head on all 99 GSE267145 participants only after the source selection lock exists. Export its ordered stable-gene axis, learned preprocessing, classifier state, training participant hash, source receipt, and convergence state.",
  "Predict the 16 GSE260666 participants once without fitting, query normalization across participants, domain adaptation, recalibration, nearest-query construction, label access, or exclusion after outcome inspection.",
  "Retain source-native labels and the one-to-one semantic mapping. Never pool NAFL and NASH, infer fibrosis or NAS, or relabel generic NAFLD as a histologic stage.",
  "GSE267145 fractional expression estimates and GSE260666 raw StringTie counts are different measurement pipelines. Per-participant log1p CPM and a source-trained transform do not remove that shift; report this as a cross-pipeline transport stress.",
  "Use participants as replicates. The four external NASH participants imply wide donor-bootstrap uncertainty and do not justify cell-, gene-, or read-level pseudoreplication.",
  "Complete accession, cohort-family, participant-alias, matrix, and expression-fingerprint deduplication before model access. Retain only salted expression fingerprints.",
  "Internal nonclinical research use needs no new DUA. Source matrices and materially trained weights are not redistributed without their separate rights review."
]
prediction_contract = "Exactly one frozen ensemble row per external participant and model, with row_id, fixed NOR/NAFL/NASH probabilities, and the corresponding fixed-order argmax."
