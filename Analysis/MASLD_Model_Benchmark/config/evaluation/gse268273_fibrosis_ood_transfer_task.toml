admission_gates = [
  "The 109 GEO records resolve to 109 unique article-described participants, BioSamples, and SRA experiments. The 824 ENA runs are technical run partitions, not biological replicates, and must be collapsed by participant before any normalization or fitting.",
  "Select and lock the model family, preprocessing, stable-gene axis, hyperparameters, calibration, thresholds, and ensemble using training cohorts only. GSE268273 expression, fibrosis, IMID status, sex, metabolic covariates, and source-paper results cannot select or repair the model.",
  "Reprocess raw reads from the frozen 824-run manifest. Quantification, technical-run collapse, count filtering, normalization, feature mapping, scaling, and any learned transform must follow the training-frozen contract. The deposited cohort-wide limma-voom matrix is contamination-audit and diagnostic evidence only and is prohibited as scored model input.",
  "Resolve the deposited layout discrepancy before quantification: 680 one-FASTQ runs from 73 participants are effective single-end, while 144 two-FASTQ runs from 36 participants are effective paired-end by mate naming and 202 bases per ENA read_count despite the declared SINGLE layout. Paired mates must enter RSEM with --paired-end and mate-wise technical-run lists; they cannot be concatenated as single-end files.",
  "The paper reports STAR with ENCODE parameters but does not deposit the exact alignment invocation or single-end fragment-length values. Use one frozen RSEM-integrated STAR contract, record the mismatch from source RSEM 1.3.0/STAR 2.5.3a, and treat agreement with deposited expression as a diagnostic rather than exact source-pipeline reproduction.",
  "Map source GENCODE release 36 genes to GRCh38.p14 and GENCODE v49. Mask the 60 absent stable IDs. Resolve the 11 duplicate v49 stable-ID mappings by deterministic sum aggregation on raw count scale before normalization, recording every source-row member; never average or sum deposited voom values.",
  "Never use the source-adjusted differential-expression workbook, its 87 reported genes, source heatmap, highlighted genes, pathways, or any feature selected using IMID status, fibrosis, BMI, or sex.",
  "All 109 participants have biopsy-proven MASLD. IMID-associated MASLD is an etiology/comorbidity OOD stratum, and classic MASLD is a comparison stratum; neither is a healthy or MASLD-negative control.",
  "Keep source fibrosis F0-F4 as the primary ordinal endpoint. Do not map any participant to GSE267145 NOR, NAFL, or NASH, and do not infer NAS or histologic components that were not deposited at participant level.",
  "The primary molecular lane cannot use IMID status, subtype, fibrosis, recorded sex, metabolic covariates, or laboratory values as inputs. These fields remain evaluator-only for outcomes and prespecified error audits. Any later clinical-only or masked-fusion lane requires a separate TaskSpec.",
  "Effective read layout is technical audit metadata, not a predictor or model-selection variable. Report residuals and endpoints separately for the 73 effective single-end and 36 effective paired-end participants. A gain confined to one layout, or reversed across layouts, cannot support a transport claim.",
  "Use participants as replicates. Bootstrap participants within the IMID-associated and classic strata; genes, runs, and technical files never contribute independent uncertainty.",
  "Complete accession, BioProject, BioSample, SRA, participant-alias, cohort-family, prior-project-use, and permissioned salted expression-fingerprint audits before model access. Raw identifiers or unsalted expression fingerprints are not released.",
  "The biopsy cohort was selected when significant fibrosis was suspected and source groups were matched on age and fibrosis. Report spectrum and selection limits; do not estimate prevalence or interpret group differences as progression.",
  "Internal nonclinical research use needs no new DUA. The article's CC BY-NC-ND 4.0 license does not assign a license to deposited participant-level data; raw or processed matrices and materially trained weights require separate redistribution review."
]
