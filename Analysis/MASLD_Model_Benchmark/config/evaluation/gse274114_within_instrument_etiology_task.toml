  "Score only two separate within-instrument contrasts: CTRL versus ENEG on HiSeq, and NASH versus ENEG_NASH on NovaSeq. Do not pool predictions, participants, or uncertainty across those biological questions except the prespecified equal-contrast mean of macro-F1.",
  "Use only the label-separated opaque no-fit Salmon fixture. Source groups, folds, participant aliases, aggregate metadata, source-paper differential genes, pathways, figures, and highlighted findings are evaluator-only and cannot enter preprocessing or feature selection.",
  "Treat Salmon NumReads as continuous estimated counts and retain EffectiveLength for offset reconstruction. Never round NumReads, treat TPM as integer counts, or run a count likelihood without the required length/offset contract.",
  "Map GENCODE v40 to GENCODE v49 fail-closed. Sum NumReads and TPM for the 44 X/PAR_Y two-row targets before normalization and use the registered TPM-weighted EffectiveLength rule. Mask all 1,230 unmapped source rows.",
  "Fit count filtering, offsets, normalization, scaling, feature selection, dimensionality reduction, hyperparameters, calibration, and thresholds within outer-training participants only. The no-fit fixture performs none of those operations.",
  "Use source-group-stratified participant bootstrap uncertainty. Genes, biopsies, files, SRA runs, and repeated numerical fields are not independent replicates.",
