schema_version = "masld-bench-model-audit-bindings-v1"
verified_date = "2026-08-22"
default_rule = "registry_model_id_equals_artifact_bundle_id"
expected_registry_model_count = 136
expected_artifact_bundle_count = 104
required_bundle_files = ["checkpoints.json", "development_crosswalk.json", "exposure_audit.json"]

# Directories under config/artifacts/models/ that are NOT census bundles.
# They hold cross-cutting, task-scoped campaign disposition records whose
# subject models each already own a census bundle of their own, so they can
# never be group bindings: binding those subjects here would re-resolve them
# away from their own directories and orphan those instead. Registering both
# takes the audit root from 104 bundles / 2 orphans to 89 / 17.
# Every entry is held to [non_census_record_rules], which are stricter than
# the census-bundle requirements, not looser. A directory that is neither derived
# from the census nor declared here still fails exactly as before.
non_census_record_directories = ["observed_multiome_integration", "remaining_multimodal_families"]

[[group_bindings]]
bundle_id = "geneformer"
model_ids = ["geneformer_v1_10m", "geneformer_v2_104m", "geneformer_v2_316m"]

