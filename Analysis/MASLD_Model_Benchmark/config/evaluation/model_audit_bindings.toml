[non_census_record_rules]
# Enforced by tests/contract/test_registry_files.py and guarded against
# regression by tests/unit/test_non_census_record_directories.py.
must_not_shadow_a_census_bundle_id = true
must_not_contain_any_required_bundle_file = true
must_contain_at_least_one_disposition_record = true
disposition_record_glob = "disposition_*.json"
named_registry_model_ids_must_own_their_own_bundle = true
undeclared_directory_in_the_audit_root_is_a_failure = true
