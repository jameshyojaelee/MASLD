admission_gates = [
  "Use 148 baseline participants with defined source NASH status for the primary endpoint. Retain all 152 baseline records in the matrix and audit, including four undefined labels that are never mapped to no NASH.",
  "The source-native label contract is config/evaluation/microarray_transfer_label_semantics.toml. Generic disease/control, healthy/NASH, fibrosis-only, inferred state, and unadjudicated steatosis labels are not compatible training outcomes.",
  "No bulk_existing_source_pool cohort enters training until its participant-level liver-biopsy label, source population, and histology definition pass the frozen label contract. The current eligible training roster is empty, so transfer remains blocked.",
  "GSE106737 and GSE83452 are one project-exposed cohort family. Exclude both accessions from training when GSE83452 is held; they cannot provide independent development or replication evidence.",
  "All baseline and follow-up records from one of the 171 participants remain in one group. A participant may never contribute one visit to fitting and another to evaluation.",
  "Start from the frozen raw CEL artifact and exact GPL16686 axis. Do not use the GEO full-cohort series matrix or Partek full-cohort global-scaling output for scored transfer.",
  "Do not run ordinary RMA or quantile normalization jointly across outer-training and held arrays. The scored lane requires a training-only quantile or sketch target applied independently to held arrays, an exact frozen single-array method whose GPL16686 support passes admission, or the registered per-array rank baseline.",
  "Probe-set summarization, transcript-cluster annotation, Entrez-to-Ensembl mapping, GENCODE v49 intersection, gene collapse, scaling, feature selection, calibration, and any learned transform remain training-frozen. Cross-platform pooling is prohibited before gene mapping.",
  "The primary gene matrix retains only transcript clusters with one unambiguous Entrez ID and one unambiguous GENCODE v49 Ensembl gene after exact frozen Bioconductor annotation. Multiple features per gene use the training-frozen median collapse; unmapped, control, ambiguous, and retired features remain explicit audit states.",
  "Age and recorded sex are mandatory adjustment and error-audit fields. Report molecular-only, age-sex-only, and masked molecular-plus-metadata results separately. Do not infer missing clinical fields or reuse NASH status as an input.",
  "Intervention assignment at baseline is a prespecified transport stratum. It is not the primary endpoint, a healthy-control definition, or evidence of future response.",
  "QC is label-blind. CEL parse, array type, finite values, RLE, intensity distribution, and PCA diagnostics may flag samples, but phenotype-aware removal is prohibited and distributional flags are not automatic exclusions.",
  "This is external-development transfer, not sealed evaluation and not a clinical NASH classifier claim."
]
