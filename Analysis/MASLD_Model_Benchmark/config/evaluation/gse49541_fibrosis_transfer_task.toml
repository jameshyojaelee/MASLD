  "The primary gene matrix retains only platform features with one unambiguous Entrez ID and one unambiguous GENCODE v49 Ensembl gene. Multiple platform features per gene are collapsed by the training-frozen median rule on the log scale; unmapped, control, ambiguous, and retired features remain explicit audit states.",
  "QC is label-blind. CEL parse, array type, finite values, RLE, intensity distribution, and PCA diagnostics may flag samples, but phenotype-aware removal is prohibited and distributional flags are not automatic exclusions.",
  "This source supports external-development transfer for a binary deposited fibrosis group, not exact-stage regression, diagnosis, prognosis, progression, or a MASLD champion claim."
]
