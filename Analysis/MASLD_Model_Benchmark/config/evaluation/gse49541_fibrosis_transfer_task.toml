  "Treat GSE49541 as a SubSeries of GSE31803. GSE31803, GSE49541, and any participant or sample aliases from that family must be absent from model fitting, feature selection, calibration, threshold selection, and contamination-eligible pretraining claims.",
  "Use all 72 deposited participants as the external-development evaluation unit: 40 mild F0-F1 and 32 advanced F3-F4. Arrays and probe sets are not independent replicates.",
  "Start from the frozen raw CEL artifact and exact GPL570 axis. Do not use the GEO full-cohort series matrix for scored transfer.",
  "Do not run ordinary RMA or quantile normalization jointly across outer-training and held arrays. The scored lane requires an inductive preprocessing object fit only on outer-training arrays and applied independently to every held array, an exact frozen single-array method whose GPL570 vectors pass admission, or the registered per-array rank baseline.",
