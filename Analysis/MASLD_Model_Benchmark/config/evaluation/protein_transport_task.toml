evaluator_parameters = { protein_feature_identity = "opaque_source_accession", primary_endpoint = "nafld_activity_score_ordinal_0_8", primary_metric_form = "pooled_out_of_fold_spearman_gain_over_protein_pca", scoring_pooling = "pooled_out_of_fold_never_average_of_per_fold", outer_folds = 5, fold_seed = 20260821, fold_assignment = "sha256_hash_of_person_key_unstratified", participants = 58, scwat_matched_participants = 56, owat_matched_participants = 25, liver_proteins = 7096, adipose_proteins = 6988, union_feature_axis = 8361, source_outcomes_available_to_model = false, source_outcomes_available_to_selector = false, prevalence_as_baseline_prohibited = true, rna_protein_pair_assumed = false }
claim_gate = "Development diagnostics only. No model can be called a champion on this task and none ever can under the current portfolio: protein_transport requires an eligible external LC-MS shotgun protein cohort and zero exist, which is recorded as structurally_impossible_not_pending. No external-transfer, disease-classification, diagnostic, prognostic, progression, causal, or treatment-response claim is eligible. A well-characterised negative is an acceptable and reportable outcome of this task."
