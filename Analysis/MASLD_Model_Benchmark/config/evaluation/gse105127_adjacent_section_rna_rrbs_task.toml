missingness_policy = "RNA and RRBS carry independent observed/derivable/below-QC/remap states. Missing CpGs, failed remaps, and absent assays are masked and never encoded as zero."
admission_gates = [
  "Use the frozen 19-participant by three-zone topology. Keep all zones, adjacent sections, assay libraries, and runs from one participant in one outer fold; only participants are biological replicates.",
  "The RNA and RRBS libraries are adjacent sections. Never describe them as same-section, same-cell, same-nucleus, same-molecule, or directly paired molecular measurements.",
  "Use all 57 RRBS BEDs only after validating the BisSNP BED contract. Reconstruct integer methylated reads from column-4 percent and column-5 coverage, then sum once across observed plus/minus strand rows for the same canonical CpG. Columns 10 and 11 are ignored auxiliary fields and never contribute counts.",
  "Retain one-strand-only CpGs with their observed coverage. An absent CpG is missing, not unmethylated; do not reproduce the source paper's zero-covered tiled aggregation as a model input.",
  "Admit only canonical two-base CpGs that are CG in the exact 1000 Genomes GRCh37 source, map uniquely as length two to a primary GRCh38.p14 contig, remain CG in the target, and return exactly to the source interval under the reverse chain. Preserve every failure with an explicit state.",
  "The public RNA bigWigs are coverage visualizations, not expression matrices. Reprocess the 57 raw single-end 76-base RNA FASTQs against GRCh38.p14 and GENCODE v49. Retain continuous RSEM expected counts, effective lengths, and TPM without rounding.",
  "Fit RNA filtering, normalization, count-to-context mapping, RRBS coverage thresholds, beta-binomial dispersion, feature selection, genomic blocking, hyperparameters, and calibration inside outer-training participants only.",
  "Cross participant folds with held CpG/genomic blocks. Apply a boundary buffer at least as wide as the largest evaluated receptive field, and merge correlated or overlapping target windows before block assignment.",
  "Compare RNA-conditioned models with training-only zone mean, training-only participant-agnostic CpG mean, nearest RNA context, RNA-only linear/MLP, sequence-only, and observed-RRBS specialist baselines. The observed-RRBS lane is separate and cannot support an RNA-only claim.",
  "Use participant by genomic-block bootstrap uncertainty. CpGs, strands, zones, sections, libraries, and reads are not independent biological replicates.",
  "Phenotype groups and histology-derived endpoints are out of scope and absent from this assay-translation fixture. A future separate supervised task must register them evaluator-only before use. This project-exposed 19-participant source cannot support an external, universal, diagnostic, prognostic, progression, treatment-response, or MASLD champion claim.",
  "No fit or score is permitted until the immutable activation fixture, source FASTA, chains, CpG crosswalk, RNA quantification, fold authority, evaluator, and model-specific derivative-weight review are frozen."
]
