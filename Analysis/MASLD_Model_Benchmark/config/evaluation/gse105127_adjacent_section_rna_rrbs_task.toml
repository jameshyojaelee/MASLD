endpoint = "Predict held-participant, held-genomic-block CpG methylation probability in RRBS from RNA measured in an adjacent liver-zone section. Score methylated-read observations conditional on observed RRBS coverage; never score unobserved CpGs as zero methylation."
metrics = ["participant_block_macro_beta_binomial_deviance_skill", "participant_block_macro_spearman_beta", "participant_block_calibration_error"]
