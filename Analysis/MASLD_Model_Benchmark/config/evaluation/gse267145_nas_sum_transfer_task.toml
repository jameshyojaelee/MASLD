schema_version = "masld-bench-task-v1"
task_id = "gse267145_nas_sum_transfer"
status = "candidate"
unit_of_inference = "participant"
input_modalities = ["bulk_rna"]
endpoint = "Transfer a training-frozen participant-level bulk RNA model of the deposited NAFLD Activity Score from GSE135251 to the GSE267145 NASH-CRN component sum. Both are the three-component Kleiner activity score on 0 to 8 with fibrosis excluded. The endpoint is continuous and is never binarised."
metrics = ["participant_spearman_nash_crn_component_sum", "participant_mae_nash_crn_component_sum", "participant_calibration_slope_nash_crn_component_sum", "participant_calibration_intercept_nash_crn_component_sum"]
datasets_train = ["bulk_existing_source_pool"]
datasets_development = ["gse267145_znf469_human_liver"]
datasets_sealed = []
split_id = "train_gse135251_held_gse267145_nas_sum_external_v1"
required_pairing_levels = ["same_study_unpaired"]
missingness_policy = "GSE135251 deposits no participant age and no recorded sex, so any age or sex covariate lane is structurally unfittable from this training source and is recorded as unfittable rather than approximated. Neither field may be inferred from the transcriptome, from cohort summaries, or from another cohort."
admission_gates = [
  "The two activity scales correspond and this was established by evidence, not by a range match. On the target side the deposited nash_crn_component_sum equals steatosis plus ballooning plus lobular inflammation exactly for all 99 participants, and adding lobular necrosis breaks that identity, so the three-component definition is demonstrated rather than assumed. On the source side fibrosis is positively excluded because five GSE135251 samples carry nas_score below their own Fibrosis_stage, including two controls at NAS 0 with fibrosis 1 and 2 and three F4 cases at NAS 3, 3 and 1, which is impossible if fibrosis were an addend. GSE135251 deposits only the activity total and not its components, so its decomposition cannot be verified directly and that residual limit is recorded here.",
  "The severity gap between the two cohorts is declared before any model is fit, not discovered at scoring. GSE135251 is a NAFLD-spectrum registry with mean activity 4.344 over 180 participants; GSE267145 is a bariatric cohort with mean component sum 2.657 over 99 participants and 24 participants at exactly 0. The 1.688-point shift means a source-trained regressor will structurally over-predict on this target. Spearman is invariant to a monotone shift and is therefore primary; mean absolute error and the calibration slope and intercept are not invariant, are reported as secondary, and are expected to degrade for this reason. Recentring, rescaling or rank-matching onto the target is prohibited and would require target outcomes in any case.",
  "The GSE267145 within-cohort Spearman of 0.776 on the component sum is that cohort's own secondary development endpoint under gse267145_histology_state_task. It is a different estimand from a cross-cohort transfer, it orients a reader, and it may not be written or reported as a bar this lane is required to clear.",
  "The null reference for the primary metric is the analytic rank-correlation null 1/sqrt(n-1) = 0.1010 at n = 99, reported alongside a permutation null obtained by simulation against each model's own realised score vector. The target carries 24 tied zeros; outcome ties do not move a rank-correlation null and the tie structure must not be used to argue for a narrower one. Prevalence-style or class-proportion references are not applicable to this endpoint and must not be substituted.",
  "GSE135251 is admitted as a training source for this continuous activity endpoint and only for it. The admission was granted by the team lead, not stated by the user, and it is recorded that way so the user can reverse it. Its grounds are that the user approved authoring this TaskSpec and running the RNA-to-RNA transfer with GSE135251 as the source, so the admission is the mechanical consequence of a decision already taken on the substance; that microarray_transfer_label_semantics.toml is contract_id gse83452_source_native_nash_semantics_v1 with target series GSE83452, so its empty eligible_source_roster governs that endpoint and its prohibition on substituting a NAS threshold for a source NASH adjudication concerns deriving a binary from a threshold, the opposite of using the activity score as a continuous endpoint in its own right; that the positive_required and negative_required clauses which made the GSE83452 admission asymmetric govern class labels, and this endpoint has no classes, so the unverified three-component definition that was load-bearing there is not load-bearing here because admission gate 1 establishes the scale correspondence from deposited data directly; and that cohort disjointness rests on the frozen audit rather than on stated provenance.",
  "This is a separate admission for a separate endpoint, not a widening of an existing one. The earlier record at executions/model-check-892-21132281-gse135251-admission is record_id gse135251_gse83452_source_roster_admission_v1, cohort family antwerp_inserm_shared, external series GSE83452, and is scoped to the nash_vs_nafl arm only. Neither admission extends to any further endpoint, target, or cohort family, and a third use of GSE135251 requires its own decision.",
  "Cohort disjointness is established by the frozen audit at executions/model-data-928-21132819/audit and not by differing stated provenance. Zero identifiers are shared across the four comparable namespaces of BioProject, BioSample, GEO sample and SRA experiment; SRA run and SRA study are absent on the GSE267145 side and are recorded as not evidence. No cross-cohort expression pair reaches the similarity that different participants already reach inside either cohort. The pre-existing frozen disjointness statement covers GSE260666 against GSE267145 and does not extend to GSE135251.",
  "Every transform that touches a held GSE267145 array is either fit on GSE135251 participants alone or is a function of that one sample column. The registered cross-cohort bridge is per-sample: gene_median centres a sample on its own median gene over the shared axis on the log scale, and per_array_rank ranks genes within one sample over the shared axis. Library size is handled inside the sample before either transform and never by a statistic pooled across samples, because both cohorts are RNA-seq deposited at different depths. Feature eligibility, variance ranking, standardisation, dimensionality reduction, hyperparameters and any calibration remain training-frozen.",
  "The GSE135251 metadata files are R write.table row-name output in which the header carries N fields and every data row carries N+1, with field 0 an unnamed row name. The N+1 invariant must be asserted and must fail closed; a reader that does not assert it silently shifts every column and returns the run accession where the fibrosis stage belongs. Of the 216 deposited counts columns, 180 carry metadata and 36 do not; the 36 are enumerated, are absent from GSE267145, and are excluded from the frozen source rather than dropped by a silent join.",
  "The gene bridge is the frozen crosswalk in executions/model-data-880-21130257-gse135251-source, which resolves the mixed symbol and unversioned ENSG row keys against GENCODE v49 into 35,661 direct Ensembl and 38,059 one-to-one symbol assignments with 3,358 ambiguous keys dropped and no collisions. It is reused rather than rebuilt.",
  "The GSE267145 NASH-CRN component sum is evaluator-only. No model, preprocessing object, feature selection step, hyperparameter search or calibration may read it, and predictions are frozen with committed digests before the evaluator joins any outcome.",
  "A fitted model whose coefficients have all been shrunk to zero is an intercept and not a model; it must be recorded as degenerate and excluded from selection, and configurations are ranked against their own permutation null rather than by a raw metric whose value is not comparable across scorers with different tie structures. Where a model is fit under several schema seeds, the minimum pairwise correlation across the seed prediction vectors is measured and reported. The registered baselines are ridge regressions and are deterministic, so five schema seeds are expected to produce one fitted prediction; when that minimum correlation exceeds the 0.999 threshold recorded in the promotion gate, the seed-direction condition is recorded not_applicable and never met, and the verdict reports conditions met out of conditions applicable with the applicable count stated explicitly so that three of three applicable can never be read as four of four.",
  "This source supports external-development transfer of a continuous activity endpoint only. It supports no exact-component regression, no diagnosis, no prognosis, no progression, no treatment response, no causal claim and no champion claim."
]
