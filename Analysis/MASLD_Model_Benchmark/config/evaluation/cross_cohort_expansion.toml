schema_version = "masld-bench-cross-cohort-expansion-v1"
registry_id = "cross_cohort_multimodal_development"
status = "plan_only_until_dataset_manifest_activation"
objective = "Generalize MASLD models across independent cohorts, datasets, assay platforms, disease contexts, and modalities without false pairing or pseudoreplication."
gse296875_is_sole_training_source = false
gse296875_is_sole_selection_source = false
gse296875_is_masld_phenotype_source = false
candidate_record_is_active_dataset = false
cohort_family_dedup_precedes_split = true
participant_dedup_precedes_split = true
same_person_all_modalities_same_outer_fold = true
missing_modality_encoded_as_zero = false
frozen_hotspot_programs_are_training_targets = false

[generalization_contract]
outer_unit = "cohort_family_then_participant_or_independent_locus"
three_or_more_compatible_families = "leave_one_study_out_outer_evaluation"
two_compatible_families = "tune_in_one_and_report_explicit_transport_to_the_other"
one_compatible_family = "internal_development_only_no_external_or_universal_claim"
sampling = "cohort_balanced_then_donor_balanced_then_cell_or_locus_balanced"
primary_reporting = "macro_average_across_cohort_families_with_donor_or_block_cluster_uncertainty"
preprocessing = "fit_inside_outer_training_partition_for_every_assay"
reference = "assay_native_source_reference_plus_frozen_GRCh38p14_GENCODEv49_crosswalk"
label_mapping = "source_native_labels_with_explicit_mapped_and_unmappable_states"
forbidden = ["random_cell_outer_split", "array_or_library_as_donor", "cross_cohort_test_normalization", "false_cell_pairing", "missing_as_zero", "same_superseries_subseries_in_different_outer_folds"]

[modality_contract]
modalities = ["single_cell_rna", "single_nucleus_rna", "single_nucleus_atac", "bulk_rna", "h3k27ac_cutrun", "rrbs_methylation", "liver_proteomics", "adipose_proteomics", "spatial_rna", "pathology", "eqtl", "ieqtl", "perturbation_rna"]
assay_native_heads_required = true
assay_native_error_models_required = true
pairing_topology_is_model_input = true
structural_missingness_mask_required = true
cross_modal_association_is_not_same_molecule_measurement = true

[activation_order]
