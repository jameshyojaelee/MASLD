schema_version = "masld-bench-variant-capability-v1"
registry_id = "variant_to_regulation_model_capability"
task_id = "variant_to_regulation"
primary_endpoint_id = "signed_cell_type_eqtl_effect"
primary_evaluator_id = "variant_ld_block_fisher_z_spearman_gain_v1"
sealed_available_context = ["dna_sequence", "single_nucleus_rna"]
sealed_unavailable_context = ["cell_type_eqtl_summary", "interaction_eqtl_summary", "single_nucleus_atac"]
endpoint_ids = ["accessibility_delta", "allelic_direction", "enhancer_gene_link", "eqtl_retrieval", "mpra_activity", "signed_cell_type_eqtl_effect"]
role_ids = ["baseline", "conditional_only", "link_only", "negative_control", "observed_context_only", "primary_candidate", "representation_only", "secondary_only"]
admission_blocking = true
blockers = ["Every variant model must emit only its registered native outputs and may be scored only on its registered endpoints; accessibility, reporter activity, enhancer-gene links, and learned representations are not signed cell-type eQTL/ieQTL effects.", "Primary eligibility requires a frozen gene and lineage output crosswalk, REF/ALT orientation, and inference from DNA sequence plus allowed sealed RNA context without observed target ATAC or outcome summaries.", "A fitted head may use only outer-training assay-native RNA, ATAC, or locus-cross-fitted MPRA targets. No eQTL/ieQTL-specific fitted head or calibration is permitted until a nonsealed signed-effect source is registered before selection lock.", "Mandatory baselines remain endpoint-specific: nearest-gene, ABC, and rE2G guard retrieval/linking; accessibility and MPRA models guard their assay-native endpoints; only records with primary_eligible=true enter the signed-effect leaderboard."]

