schema_version = "masld-bench-atac-capability-v2"
registry_id = "rna_conditioned_atac_model_capability"
task_id = "rna_conditioned_atac"
profile_output_definition = "The adapter emits a donor-by-cell-state peak accessibility profile on the frozen peak universe from DNA sequence and observed RNA/context inputs, with finite values, stable identifiers, and no observed ATAC values in any inference input."
latent_integration_definition = "The adapter consumes ATAC or emits only a joint/aligned latent representation and therefore cannot enter an RNA-conditioned ATAC profile leaderboard."
profile_metrics = ["conditional_multinomial_profile_deviance_skill", "donor_peak_auprc", "donor_profile_spearman"]
retrieval_metrics = ["donor_cell_state_retrieval"]
direct_profile_candidate_models = ["babel", "cobolt", "corgi_regular", "midas", "multivi", "scbutterfly", "scdiffusionx", "scpair"]
conditional_profile_candidate_models = ["context_borzoi", "corgi_plus"]
profile_baseline_models = ["assay_native_pseudobulk", "bpnet", "chrombpnet", "context_only", "mean_track", "nearest_context", "scbasset", "sequence_cnn_control", "sequence_only", "sequence_transformer_control", "shrunken_pseudobulk", "shuffled_context", "trans_only"]
sequence_required_models = ["bpnet", "chrombpnet", "context_borzoi", "corgi_plus", "corgi_regular", "scbasset", "sequence_cnn_control", "sequence_only", "sequence_transformer_control"]
latent_only_models = ["cca", "chrombert", "cistopic", "epiagent", "epifoundation", "lsi", "mira", "mofaplus", "pca_procrustes", "peakvi", "scglue", "scjoint", "scmomat", "scmvp", "seurat_wnn", "stabmap"]
profile_fixture_passed_models = ["assay_native_pseudobulk", "bpnet", "cobolt", "mean_track", "nearest_context", "scpair", "shrunken_pseudobulk", "shuffled_context", "trans_only"]
latent_only_status = "registered_not_schedulable_until_separate_nonpromotable_task_exists"
admission_blocking = true
blockers = ["Every direct, conditional, and baseline profile model must pass a fixed-fixture test proving that inference without observed ATAC emits the frozen donor-by-cell-state peak profile before it can be scored.", "Conditional candidates remain blocked until their RNA/context mapper and missing-modality path are frozen and the same fixture passes.", "Latent-only models remain registered for later integration diagnostics but are not scheduled on this profile task and cannot support an ATAC-profile winner claim.", "A failed or unavailable profile fixture never licenses scoring latent distances as synthetic accessibility profiles."]
