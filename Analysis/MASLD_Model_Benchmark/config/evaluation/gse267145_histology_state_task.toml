admission_gates = [
  "Use the frozen 99-participant authoritative join and five fixed stage-balanced outer folds. Participants are the biological replicates; assays, aliquots, regions, and genes are not replicates.",
  "The primary stage3 ontology maps NOR to NOR, NAFL to NAFL, and NASH_F0, NASH_F1, and NASH_F23 to NASH. The five source stage labels remain a secondary endpoint and are never treated as a uniformly spaced ordinal scale.",
  "Derive the NASH-CRN activity score only as the prespecified sum of source-native steatosis, ballooning, and lobular-inflammation components. Keep fibrosis on its recorded 0 to 3 scale and lobular necrosis separate.",
  "Fit normalization, feature filtering, scaling, dimensionality reduction, imputation, model hyperparameters, calibration, and any molecular or metadata fusion only within outer-training participants. Histology labels may enter supervised task heads and inner selection only.",
  "Never use the publication's NOR-versus-NASH differential regions, differential genes, gene signatures, figures, highlighted loci, or any other full-cohort outcome-selected feature set. Start from the complete deposited assay axes and fit feature selection inside training folds.",
  "RNA inputs are nonnegative fractional expression estimates. Do not round them, impose an integer count likelihood, or reconstruct DESeq2 without tximport lengths and offsets.",
  "Treat H3K27ac region strings as opaque source feature keys. Sequence extraction, coordinate conversion, motif analysis, interval overlap, and coordinate-derived annotation remain prohibited while coordinate semantics are unresolved.",
  "Held-participant H3K27ac is evaluator-only in the RNA-only lane. It is an observed query modality only in the separately reported observed-pair multimodal lane; the latter cannot support an RNA-only claim.",
  "Recorded sex is an adjustment and error-audit field in v1, not a primary predictor. No participant-level age or BMI values are available in the frozen public join, and cohort summaries must not be assigned to individuals.",
  "Report cross-sectional histology-associated remodeling only. This single-cohort development task cannot support a diagnostic, prognostic, progression, treatment-response, external-transfer, universal-model, or task-champion claim.",
  "Internal nonclinical research use is allowed without a new DUA. Raw or processed source data are not redistributed, and materially trained derivative weights require model-specific terms and legal review before release."
]
