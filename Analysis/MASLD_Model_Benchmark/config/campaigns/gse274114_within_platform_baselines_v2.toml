[[models]]
model_kind = "hvg_pca_linear_svm"
seed_policy = "five_fixed_seeds_1103_2207_3301_4409_5501"
preprocessing = "training-only log-CPM, prevalence filter, variance selection, scaling, PCA, nested three-fold hyperparameter ranking, first outer-training-convergent ranked candidate, and training-only probability calibration"

[firewall]
feature_staging_reads_labels = false
feature_staging_reads_folds = false
feature_staging_runs_normalization = false
trainer_view_contains_training_labels = true
trainer_view_contains_held_fold_labels = false
trainer_view_contains_source_group_strings = false
trainer_view_contains_participant_covariates = false
trainer_accepts_evaluator_paths = false
preprocessing_fit_on_outer_training_participants_only = true
cohort_wide_normalization_allowed = false
prediction_tables_contain_observed_labels = false
prediction_bundles_frozen_before_evaluator_labels_open = true
partial_prediction_set_scoring_allowed = false
threshold = 0.5
convergence_warning_policy = "invalidate_hyperparameter_candidate"
no_valid_hyperparameter_candidate_policy = "fail_outer_fold"
selected_outer_fit_convergence_warning_policy = "try_next_inner_ranked_candidate_then_fail_outer_fold"
outer_candidate_fallback_uses_training_partition_only = true
outer_candidate_fallback_uses_query_outcomes = false

[covariates]
participant_level_metadata_available = false
age_input_allowed = false
sex_input_allowed = false
fibrosis_input_allowed = false
nas_input_allowed = false
group_aggregate_metadata_input_allowed = false
activation_rule = "A future revision may add age, recorded sex, fibrosis, NAS, or other histology only from verified participant-level fields, with missing-state masks and fold-local preprocessing. Group summaries can never be assigned to participants."

[evaluation]
metrics = ["participant_macro_f1", "participant_auprc", "participant_auroc", "participant_brier", "participant_log_loss"]
bootstrap_unit = "participant_stratified_by_binary_source_label"
bootstrap_replicates = 10000
multiplicity = "development primary effect and interval; BH q<0.05 only within the prespecified task secondary endpoint family"
clinical_claims_allowed = false
