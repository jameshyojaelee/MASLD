description = "Firewall-baseline-only re-freeze of the v11 B6K execution-runtime revision. v11 (candidate e17be3dab9ba48cb) froze a Resource snapshot at 494c07135cebab28 and was invalidated before any run executed by a second adoption burst on 2026-08-25: figures/main/fig4_singlecell_programs/captions.md was rewritten at 12:53:11 (e8fc7ccacf200b6c, 7885 B -> dd3c69138df040ac, 7868 B). That file is gitignored, so the drift is invisible to git status. Exactly one of the 1,676 human-edited authority files changed; none added, none removed. This revision re-baselines the protected snapshot against a quiet tree and changes NOTHING else: the scoped fixed source record, the gpu_rna_atac_torch_b6k fixed runtime and its validated cu128 runtime tree, the gpu_rna_atac_b6k profile, the adapter allowlist guard, every seed, fold, split_seed, hyperparameter, dataset view, evaluator, missingness rule, the five-seed by five-fold GPU grid, and the 150-run CPU control matrix are all carried over byte-identical from v11 and asserted as such. The B6K runtime validation (job 21107495) and adapter suite (job 21107681) are unchanged and are not re-run. CONSTRAINT ON FUTURE COMPARISONS: Cobolt executes on a runtime no other observed_multiome member shares; its comparator is the 150-run CPU control matrix re-fit under this campaign, and all 25 GPU fits run serially on one B6K device, so within-bundle hardware homogeneity holds by construction. A cross-model observed_multiome ranking may not treat this campaign as runtime-comparable with L40S-fit members without first establishing numeric interchangeability under config/b6k_numeric_tolerance_prespecification_20260825.json. No L40S-versus-B6K numeric comparison exists for Cobolt (job 21060919 never recorded a loss), and the absence of a comparison must not be read as a comparison having passed. v10 and v11 both remain valid frozen provenance records and neither is re-executable."
