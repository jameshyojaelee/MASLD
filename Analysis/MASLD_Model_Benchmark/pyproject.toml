[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masld-bench"
version = "0.1.0"
description = "Contamination-audited MASLD multimodal model benchmark control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
masld-bench = "masld_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

