[lanes.region]
lane_id = "region_structural_corroboration"
status = "NO_ELIGIBLE_MODEL_OUTPUT"
headline_eligible = false
runnable = false
rankings = []
evidence_available_but_unscoreable = ["screen_ccre_hepg2", "abc_liver", "roadmap_liver_E066", "encode_liver"]
finding = "Roughly 1 GB of verified, genuinely COLOC-independent structural annotation is present and has NOTHING to be scored against. The only two candidate region-level rankings both fail: Sei is a variant model in the 1,033-element MPRA universe, and the observed-ATAC GLM emits a five-block profile deviance skill rather than per-element scores."
this_is_a_result_not_an_omission = "The substrate is real and the gap is on the model side. Recording it tells a future lane exactly what would unlock this annotation: any model output that scores thousands of individual genomic regions."
do_not_freeze_this_lane = true

[lanes.variant]
lane_id = "variant_mpra_corroboration"
headline_eligible = true
rankings = ["hyenadna_mpra_delta", "sei_native_40_class"]
evidence = "zhu2026 mpra variant layer, via the upstream parse"
evidence_path = "GWAS/finemapping/results/seqfunc/mpra_benchmark/mpra_substrate_truth.tsv"
evidence_rows = 1128

[lanes.variant.producer_error_corrected]
revision_1_claimed = "the Zhu resource holds only positives, so a discrimination test is impossible and a 2x2 is prohibited"
that_was_wrong = true
why = "Revision 1 read the 27-row CURATED csv, data/external/zhu2026_masld_mpra/zhu2026_masld_mpra_calls.csv, which contains only DAVs. The upstream parse the README itself names carries 1,128 rows with a dav column: 87 positive and 1,041 negative."
consequence = "A discrimination test IS possible, and its negatives are the right kind: variants tested in the SAME MPRA and found non-significant. That is an ascertainment-matched negative set from the same assay, which is precisely the non-asymmetric denominator revision 1 said did not exist."

[lanes.variant.realised_overlap]
frozen_universe_elements = 1033
substrate_rows = 1128
substrate_dav_positive = 87
substrate_dav_negative = 1041
rows_inside_the_frozen_universe = 232
dav_inside = 17
non_dav_inside = 215
