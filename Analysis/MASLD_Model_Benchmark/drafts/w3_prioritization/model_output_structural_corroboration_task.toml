# are NOT interchangeable rankings, and the matrix says so explicitly.
# ---------------------------------------------------------------------------

[eligibility]
rule = "A model output may only be scored against evidence at its own unit. Cross-unit scoring is prohibited, not discouraged."

[eligibility.matrix]
correction_note = "Revision 1 placed sei_native_40_class and observed_atac_glm_region_skill in the REGION lane. Both rows were wrong and both are corrected here, each against artifact evidence rather than assertion."

hyenadna_mpra_delta = { unit = "variant", authority = "executions/model-cpu-train-605-21099008", artifacts_sha256 = "c2685589276933ae91bb73fc9a804a81eda0a16c10e28cc360f93f7afb3d2396", metric = "delta_ridge", value = 0.21622332457761556, per_element_predictions = "fit/oof_predictions.tsv.gz", elements = 1033, eligible_evidence = ["zhu2026 mpra variant layer"], ineligible = ["cCRE", "ABC", "chromHMM", "H3K27ac", "gnomAD constraint"] }

sei_native_40_class = { unit = "variant", authority = "executions/model-cpu-train-604-21097189", artifacts_sha256 = "f77dac4d7c6b924c201a266e96f855bab8d56c8682ffcda5236e30957f71510a", metric = "native_40class_ridge", value = 0.19386484092133013, per_element_predictions = "fit/oof_predictions.tsv.gz", elements = 1033, eligible_evidence = ["zhu2026 mpra variant layer"], ineligible = ["cCRE", "ABC", "chromHMM", "H3K27ac", "gnomAD constraint"] }
sei_correction_evidence = "Sei's own out-of-fold table carries exactly the same 1,033 element_ids as HyenaDNA, and sits beside available_simple_controls/allele_identity_ridge and /zero - the allelic-effect controls. Sei is a VARIANT model in the same MPRA universe, not a region model. Verified from executions/model-cpu-train-604-21097189/fit/oof_predictions.tsv.gz, not accepted on assertion."

observed_atac_glm_region_skill = { unit = "not_rankable", authority = "executions/model-cpu-score-328-21100332", artifacts_sha256 = "6b8cbf9e38da67f6d0b63ccc0978b678ea45c2bbc125dbab9e1ed8d878a73d21", metric = "five_seed_ensemble_profile_deviance_skill", value = 0.162666866678673, ci = [0.15199894584277426, 0.17325905925000024], eligible_evidence = [], ineligible = ["everything"] }
atac_glm_exclusion_evidence = "Its receipt records genomic_blocks = 5, n_cells = 195, n_observations = 975 and prediction_matrices = 625. The output is a per-lineage profile deviance skill over FIVE genomic blocks, not a per-element score across thousands of regions. There is nothing in it to rank against a cCRE or an ABC enhancer. It is a complete authorised result - partial_ranking_authorized false, partial_rectangle_used false - it simply is not a ranking."

gene_level_stage_associations = { unit = "gene", eligible_evidence = ["gnomad_constraint"], ineligible = ["zhu variant layer", "cCRE", "ABC", "chromHMM"] }

[eligibility.open_item_before_freeze]
status = "CLOSED - all three authorities resolved by path and digest and bound in the matrix above"
per_element_predictions_exist = true
per_element_predictions_location = "fit/oof_predictions.tsv.gz in each run, a FILE inside fit/ rather than a predictions/ directory, which is why a directory search missed it"
reuse_constraint_holds = "The frozen out-of-fold tables carry per-element predictions with element_id, model_id, head_id, prediction, seed, outer_fold and long_range_block_id. Nothing needs re-deriving from frozen heads, so 'reuse completed outputs, fit nothing new' is satisfied and no additional authorisation is required."
heads_are_weights_only = "fit/heads/**.npz contain coefficient (128 for HyenaDNA, 40 for Sei), intercept, selected_alpha and the feature mean/scale/indices. They are fitted head weights and carry no per-element output - confirmed by opening them."
superseded_issue = "The specific frozen artifacts carrying the three named model outputs were NOT resolved at revision 1."
what_is_registered = "config/evaluation/family_native_tournament.toml registers model_id 'hyenadna' and the endpoint families 'mpra_activity' and 'accessibility_delta', so the identities exist. The headline values quoted in the lane briefing (0.2162 MPRA delta, +0.082 gain over the allele ridge, 0.1627 ATAC-GLM deviance skill) were NOT located in config/ during the substrate check."
requirement = "Every ranking input must be pinned by execution path and ARTIFACTS.json digest before this spec is frozen. No number is bound to this lane on the strength of a value quoted in conversation."

