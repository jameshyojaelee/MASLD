schema_version = "masld-bench-task-v1"
task_id = "model_output_structural_corroboration"
status = "draft_substrate_cannot_support_this_lane_as_scoped"
draft_revision = 3
draft_revision_note = "Revision 2 removes an eligibility matrix that revision 1 encoded and that is now known to be wrong on two rows, corrects an error of the producer's own about the Zhu negatives, and binds the three ranking authorities by path and digest. It does not settle scope: the cell-model question below is unresolved and gates the lane."
draft_note = "DRAFT under drafts/. Not an authority until reviewed, moved into config/tasks/ and hash-pinned."

unit_of_inference = "independent_locus"
unit_inherited_from = "config/tasks/typed_evidence_graph.toml"
unit_note = "Inherited, not invented. Individual variants and neighbouring regions are correlated, so a per-variant or per-region bootstrap understates uncertainty."

endpoint = "Do the campaign's own completed model outputs rank targets in a way that COLOC-independent structural evidence supports? This scores existing rankings against external annotation; it fits nothing new."

# ---------------------------------------------------------------------------
# Relationship to the registered prioritization endpoint.
# ---------------------------------------------------------------------------

[relationship_to_typed_evidence_graph]
registered_endpoint = "config/tasks/typed_evidence_graph.toml"
this_lane_supersedes_it = false
this_lane_amends_it = false
that_file_must_remain_byte_identical = true
verified_before_and_after = true
different_question = "typed_evidence_graph ranks genes FROM a typed evidence graph and trains on the Resource COLOC. This lane takes rankings that already exist, produced by models trained on other substrates, and asks whether independent structural annotation corroborates them. Neither is a substitute for the other."
why_the_coloc_admission_block_does_not_bite = "config/datasets/current_coloc_gwas.toml carries admission_blocking = true pending promotion of the corrected 50-study COLOC rerun. This lane does not train on, read, or score against current_coloc_gwas, so that blocker is out of scope here. It remains binding on typed_evidence_graph, which does train on it."
coloc_is_not_an_input_to_this_lane = true

# ---------------------------------------------------------------------------
# Substrate. Every resource verified as real content, not a stub, before binding.
# ---------------------------------------------------------------------------

[substrate.verification]
method = "file count and total bytes under each directory"
motivation = "config/datasets/genebass was registered and is an EMPTY directory. A registry entry is not evidence that content exists."
genebass_excluded = "0 files, 4096 bytes - directory entry only. Excluded and recorded so nobody binds it."

[substrate.structural_primary]
independence_basis = "none of these derive from the liver GWAS that the Resource COLOC consumed, so they are genuinely independent of the Resource's genetic layer"
abc_liver = { files = 2, bytes = 342646808, content = "HepG2 ABC enhancer predictions and the AvgHiC ABC prediction table" }
encode_liver = { files = 2, bytes = 556372384, content = "H3K27ac and H3K27me3 bigWig" }
roadmap_liver_E066 = { files = 5, bytes = 10893438, content = "chromHMM 15-state hg38 and H3K27ac broadPeak" }
screen_ccre_hepg2 = { files = 1, bytes = 129087151, content = "GRCh38 cCREs" }
gnomad_constraint = { files = 1, bytes = 95550137, content = "gnomAD v4.1 constraint metrics" }

[substrate.variant_level_external]
zhu2026_masld_mpra = { files = 2, bytes = 19414, doi = "10.1038/s41588-026-02617-8" }
usable_layer = "variant"
excluded_layer = "gene"
exclusion_reason = "The resource's own README states that the DAV status and mpra_log2fc are Zhu's, but 'The gene label attached to a DAV is our finemapping/coloc locus assignment for that variant.' The gene attribution is the Resource's own. Scoring a GENE ranking against gene labels the Resource assigned would be circular at exactly the level being scored. The variant readout is independent; the gene layer is not."
readout = "signed allelic reporter effect, zhu_mpra_log2fc, with an rsID in zhu_lead_variant"
n_dav = 23
n_featured_target = 4
n_total_rows = 27
positives_only = true
positives_only_consequence = "This file contains only SIGNIFICANT DAVs. It carries no non-DAV comparison set, so a discrimination test is impossible from it alone. Importing negatives from another variant source with different ascertainment would be the asymmetric-denominator trap. This lane therefore runs a CONCORDANCE test among the 23, never a 2x2."

[substrate.prohibited]
gtex_v8_liver_eqtl = "DO NOT USE. data/gtex_v8_liver_eqtl/ contains ONE file, chrX only, with header 'Entrez Variant CHR POS NEA EA EAF Beta SE PVAL N Studies GeneSymbol ENSG Gene_Biotype'. A Studies column indicates a meta-analysis, which is not GTEx v8's native eQTL schema, and the filename matches the data/broadaway_eqtl pattern. The directory name asserts a provenance its contents do not support."
gtex_v8_liver_sqtl = "NOT an eQTL substitute. Splicing QTL is a different molecular phenotype and may not stand in for expression QTL."
current_coloc_gwas = "not an input to this lane at all"
resource_owned = "Gene Catalog, portal, figures, evidence classes, thresholds and the 117 Hotspot programs are read-only and are not scored here"

