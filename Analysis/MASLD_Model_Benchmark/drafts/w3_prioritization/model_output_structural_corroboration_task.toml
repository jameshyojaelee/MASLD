concordance = { statistic = "signed Spearman of predicted allelic delta against zhu_mpra_log2fc", n = 17, null_se = 0.2500, two_null_se = 0.5000, powered = false, disposition = "records not_applicable, underpowered by construction, NEVER met=false" }
