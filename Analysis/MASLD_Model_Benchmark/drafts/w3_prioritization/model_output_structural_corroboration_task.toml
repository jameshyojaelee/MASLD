variant_lane = "either an MPRA whose tested variants overlap the frozen 1,033-element universe far more than 5.1 percent, or predictions generated over the Zhu variant set rather than over the existing MPRA element panel"
note = "Both gaps are on the model-output side. The external evidence is real, licensed and independent; nothing in the campaign currently produces a ranking at the unit the evidence is measured on."


# ---------------------------------------------------------------------------
# Required at freeze. Lessons that outlive this lane.
# ---------------------------------------------------------------------------

[lessons.row_count_is_not_a_unit_count]
first_class_finding = true
statement = "A row count is not a unit count, and a design expanded across conditions inflates it by exactly the expansion factor."
this_substrate = "282 distinct variants x 2 cell models x 2 stimuli = 1128 rows"
what_both_parties_did = "The team lead and the producer both reasoned from 1128 and 564 as if they were variant counts. Both are row counts of a 4x expansion. The 17 DAV rows were never 17 variants; under HepG2 they collapse to 5 rsIDs on 5 elements."
consequence = "EVERY power number quoted by either party before the distinct-variant check was wrong for this reason, including the producer's own 0.4264 threshold, which assumed n=23."
same_shape_as = ["the SRR-run-versus-donor trap in W2", "the sample-versus-donor collapse earlier in this project"]
rule = "Before any power arithmetic, report distinct units alongside row counts and state which one the arithmetic uses."

[lessons.convenience_is_a_tell]
verbatim = "The convenience of doubling n was exactly the tell."
context = "Pooling HepG2 and LX2 would have doubled n. That convenience was the signal to check whether the pooling was legitimate, not a reason to do it."
generalised = "When a methodological shortcut happens to increase power, treat the convenience itself as a prompt to verify the shortcut, because motivated reasoning runs in the direction of more n."

[lessons.unit_alignment_is_a_design_constraint]
statement = "Unit alignment with external evidence must be a design constraint at the point a task is REGISTERED, not something discovered at scoring time."
why = "This benchmark's endpoints were chosen to be internally rigorous, and they do not align with the units independent external evidence is recorded on. That misalignment is invisible until an external corroboration lane is attempted, and by then the model outputs are already frozen at the wrong unit."
evidence_from_this_lane = "The region annotation needs a model scoring thousands of individual genomic regions and none exists; the variant evidence needs predictions over the Zhu variant set, and the frozen 1,033-element MPRA panel overlaps it at 5.1 percent."

[campaign_level_finding]
statement = "Both gaps are on the model-output side. The external evidence is fine."
elaboration = "The external evidence is real, licensed, verified and genuinely COLOC-independent. What is missing is any campaign output measured at the unit that evidence is recorded on."
this_is_structural_not_incidental = "It is a statement about what this benchmark has optimised for: internal rigour at units of its own choosing."
not_a_criticism_of_the_substrate = true

[no_gate_registered]
decision = "This lane has NO promotion gate, by team lead ruling of 2026-08-26."
reason = "A gate for a lane that cannot run would assert more than we know."
a_draft_gate_exists_unfrozen = "drafts/w3_prioritization/model_output_structural_corroboration_promotion_gate.json is marked MUST_NOT_BE_REGISTERED and is retained only as a working record of what would have been tested."
the_zero_applicable_finding_is_preserved_here = "Applying not_applicable honestly leaves zero applicable conditions, and an evaluator computing all() over an empty list returns True - so a naive implementation would emit PASS having tested nothing. The correct third state is NO_APPLICABLE_CONDITIONS: not PASS because nothing was demonstrated, not FAIL because nothing was tested. Any gate can reach this state once not_applicable is applied honestly, so every evaluator must handle 0/0 explicitly."

[cell_type_specificity_evidence]
bound_as_evidence = true
purpose = "turns a principled ruling into a demonstrated one, so a future reader tempted to pool is stopped by data rather than by an argument"
hepg2_dav_rsids = 25
lx2_dav_rsids = 44
dav_in_both = 13
hepg2_only = 12
lx2_only = 31
unique_davs = 56
reading = "Fewer than a quarter of the 56 unique DAVs are shared between the two cell lines. Pooling would have merged two largely disjoint positive sets, with the same variant positive in one line and negative in the other."
