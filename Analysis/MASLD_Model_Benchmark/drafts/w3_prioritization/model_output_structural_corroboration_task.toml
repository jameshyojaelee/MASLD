[verdict.stimulus_decision]
question = "may HepG2_control and HepG2_PAOA be pooled?"
decision = "NOT pooled for the primary. Each of the 57 elements carries a prediction under each context and a measurement under each stimulus; pooling would enter every element twice and treat two conditions as independent observations."
