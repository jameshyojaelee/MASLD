known_resource_derived_examples = ["max_pip", "coloc_pp4_best", "colocalizes", "coloc_match", "is_DEG", "primary_gene", "is_final_nomination_lead", "magnitude_percentile"]
known_resource_derived_note = "Listed as examples of what the default correctly excludes, NOT as the definition of what is excluded. The definition is: anything not on the allowlist."
provenance_basis = "the resource README states that the DAV status and mpra_log2fc are Zhu's while the gene attribution is the Resource's finemapping/coloc assignment"

[lanes.variant.OPEN_QUESTION_GATING_SCOPE]
question = "may an LX2 measurement be scored against a HepG2 prediction?"
why_it_matters = "The substrate is 564 HepG2 plus 564 LX2, each variant measured twice. The frozen predictions carry assay_context_id of HepG2_control and HepG2_PAOA - both HepG2. If LX2 rows cannot be scored against HepG2 predictions, the usable overlap roughly halves to about 116 rows and 8 or 9 DAVs."
consequence_if_hepg2_only = "discrimination becomes marginal and concordance is dead; W3 would reduce to a single underpowered arm and 'the substrate cannot support this lane as scoped' becomes the honest finding"
status = "UNRESOLVED - this is a scientific call, not bookkeeping, and it is not the producer's to make"
scope_is_not_settled_until_this_is_answered = true

[lanes.gene]
lane_id = "gene_constraint_corroboration"
headline_eligible = false
rankings = ["gene_level_stage_associations"]
evidence = ["gnomad_constraint"]
question = "are genes the stage-association models rank highly more constrained than expression-matched genes?"
weakness_stated = "gnomAD constraint is neither liver-specific nor fibrosis-specific. It measures depletion of loss-of-function variation across all human tissues and phenotypes."
what_a_positive_can_support = "that the ranked genes are enriched for genes under selective constraint, which is a statement about general biological importance"
what_a_positive_CANNOT_support = "that the ranked genes are MASLD-relevant, liver-relevant, or fibrosis-relevant. Constraint would rank a haploinsufficient neurodevelopmental gene above a liver-specific enzyme."
consequence = "this lane is reported as descriptive context and is not headline-eligible; it cannot advance the gate on its own"

# ---------------------------------------------------------------------------
# Controls. The asymmetric-denominator trap is the live risk here.
# ---------------------------------------------------------------------------

[controls.matched_background]
mandatory = true
the_trap = "Regions with more coverage and higher accessibility are both EASIER for a model to score well AND MORE LIKELY to have been annotated as a cCRE or an ABC enhancer. That correlation alone manufactures enrichment with no model skill involved."
matching_is_modality_specific = "Matching on the wrong covariate is the same error in a new costume."
region_lane_match_on = ["accessibility", "sequencing coverage", "GC content", "region length", "mappability"]
variant_lane_match_on = "not applicable - concordance among a fixed positive set, no background is drawn"
gene_lane_match_on = ["expression"]
gene_lane_matching_rationale = "An earlier orthogonality-ladder enrichment in this project was an expression artifact: the expression-matched ladder was FLAT at 1 across all 11 floors. A gene lane matched on anything other than expression repeats that failure."
region_lane_matching_rationale = "Expression matching is meaningless for a genomic region. Accessibility and coverage are the covariates that drive both the model score and the annotation probability here."

[controls.universe]
must_be_stated_explicitly = true
must_be_justified = true
prior_failure = "An earlier Fisher test in this project used a universe of 27,638 where 14,931 was correct. Both 'significant' enrichments evaporated when the universe was fixed."
region_universe = "the regions the ranking model actually scored, not all annotated regions and not the whole genome"
gene_universe = "the genes the association model actually tested, not all protein-coding genes"
rule = "The universe is the set the model could have ranked. A gene or region the model never scored was never available to be ranked and may not sit in the denominator."

[controls.nulls]
auprc_null = "measured permutation null computed from each model's OWN realised score-vector tie structure"
prevalence_is_never_the_null = "Prevalence has sat BELOW the measured null mean in all three cohorts tested this week. Scoring average precision against prevalence manufactures significance."
rank_correlation_null = "measured by permutation, reported beside the 1/sqrt(n-1) analytic reference"
both_references_reported = true

[controls.comparison]
model_vs_model = "paired bootstrap on the same resampled blocks"
overlapping_marginal_intervals_are_not_evidence_of_absence = true

[controls.reporting]
p_value_resolution_floor = "A p-value from R permutations may not be reported below 1/(R+1). At 10000 replicates, 3 exceedances is reported as p <= 1e-4, never as 3.0e-4."
threshold_free_beside_every_2x2 = true

# ---------------------------------------------------------------------------
# Uncertainty.
# ---------------------------------------------------------------------------

[uncertainty]
method = "paired_ld_and_gene_block_bootstrap"
resampling_units = ["ld_block", "gene_block"]
inherited_from = "config/tasks/typed_evidence_graph.toml"
bootstrap_replicates = 10000
block_definition_open_item = "The LD-block source must be pinned before freeze. Approximately-independent LD blocks are preferred; if no block file is present on disk, fixed-width genomic blocks are the fallback and the width must be justified, not defaulted."
why_blocks_and_not_units = "Neighbouring accessible regions share chromatin-domain structure and neighbouring variants share LD. Resampling regions or variants independently would treat correlated observations as independent and understate the interval."

multiplicity_family = "model_output_structural_corroboration_primary"
multiplicity_method = "bh_q0.05_within_each_lane_s_own_family"
promotion_gate_id = "model_output_structural_corroboration_development_v1"

claim_gate = "External-development corroboration only. This lane scores existing model outputs against independent structural annotation. No champion, sealed confirmation, causal, diagnostic, prognostic, or clinical claim is eligible, and no result here amends the Resource's evidence classes, Gene Catalog, thresholds or the 117 Hotspot programs."
external_development_only = true
champion_eligible = false

