[lanes.variant.column_allowlist]
policy = "ALLOWLIST with default deny. Not a blocklist."
why_not_a_blocklist = "The upstream table mixes Zhu's experimental readout with the Resource's own annotation in one file. A blocklist requires enumerating every Resource-owned column correctly and fails silently the moment a new one appears or one is missed. An allowlist fails closed: a column nobody positively attributed to Zhu is simply not scoreable."
