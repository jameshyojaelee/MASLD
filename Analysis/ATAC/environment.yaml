# ATAC-seq Analysis Environment
# Covers bulk ATAC (Module 1) and scATAC (Module 2) processing
# Usage: micromamba create -f environment.yaml
name: atac_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # QC & preprocessing
  - fastp>=0.23.4
  - fastqc>=0.12.1
  - multiqc>=1.21
  - trim-galore>=0.6.10

  # Alignment (bulk ATAC)
  - bowtie2>=2.5.3
  - samtools>=1.19
  - picard>=3.1.1
  - bedtools>=2.31.1

  # Peak calling
  - macs2>=2.2.9.1

  # Visualization & QC
  - deeptools>=3.5.5

  # Quantification
  - subread>=2.0.6

  # scATAC processing
  - python>=3.10
  - snapatac2>=2.6
  - anndata>=0.10
  - scanpy>=1.10
  - muon>=0.1.6

  # TF motif analysis
  - pyjaspar>=3.0
  - gimmemotifs>=0.18

  # Utilities
  - pybiomart>=0.2.0
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.12
  - matplotlib>=3.8
  - seaborn>=0.13
  - pyyaml>=6.0

  # R packages (for DiffBind & ChIPseeker)
  - r-base>=4.2
  - bioconductor-diffbind>=3.12
  - bioconductor-chipseeker>=1.38
  - bioconductor-atacseqqc>=1.26
  - bioconductor-genomicranges>=1.54
  - bioconductor-txdb.mmusculus.ucsc.mm39.knowngene
  - bioconductor-org.mm.eg.db
  - bioconductor-deseq2>=1.42
  - r-ggplot2>=3.5
  - r-pheatmap

  # SCENIC+ (pip-only packages)
  - pip:
    - scenicplus>=1.0.0
    - pycisTopic>=2.0.0
    - pycistarget>=1.0.0
    - chromvar>=0.1  # Python wrapper if available
